# flow-bot：A 的期末自動開發機器人（設計：docs/superpowers/specs/2026-11-21-flow-bot-design.md）。
#
# 權杖保護：CLAUDE_CODE_OAUTH_TOKEN、FLOWBOT_PAT 放在 Environment「flow-bot」，
# 部署分支限定 main。只有跑在 main 上的 workflow 拿得到；組員在自己分支新增的 workflow 拿不到。
# 本檔所有觸發（workflow_run、issue_comment、pull_request_target、push main、schedule、
# 從 main 執行的 workflow_dispatch）都以 main 為 ref。
#
# 流程：gate（唯讀 GITHUB_TOKEN）判斷要做什麼 → script／claude／review 三種 job →
# 每個 job 開始前 recheck，結束後 status 更新置頂 issue。總開關：repo variable FLOWBOT_ENABLED=true。
name: flow-bot

on:
  workflow_run:
    workflows: [flow-bot-relay]
    types: [completed]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: 要執行的任務
        type: choice
        options: [sync_and_story, review_others, feedback]
        default: sync_and_story
      pr:
        description: PR 號碼（review_others、feedback 需要）
        required: false

permissions:
  contents: read

env:
  FLOWBOT_OWNER: ${{ vars.FLOWBOT_OWNER || 'max930000' }}

jobs:
  gate:
    if: vars.FLOWBOT_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      script_tasks: ${{ steps.gate.outputs.script_tasks }}
      claude_tasks: ${{ steps.gate.outputs.claude_tasks }}
      review_tasks: ${{ steps.gate.outputs.review_tasks }}
      has_script: ${{ steps.gate.outputs.has_script }}
      has_claude: ${{ steps.gate.outputs.has_claude }}
      has_review: ${{ steps.gate.outputs.has_review }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 判斷要做的任務
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/flow-bot/gate.py

  script:
    needs: gate
    if: needs.gate.outputs.has_script == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: flow-bot
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.gate.outputs.script_tasks) }}
    concurrency:
      group: ${{ matrix.task.group }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.FLOWBOT_PAT }}
          fetch-depth: 0
      - name: 再確認一次
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
          TASK: ${{ toJSON(matrix.task) }}
        run: python3 .github/flow-bot/gate.py recheck
      - name: 設定 git 身分
        if: steps.recheck.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
        run: |
          id=$(gh api "users/$FLOWBOT_OWNER" --jq .id)
          git config user.name "$FLOWBOT_OWNER"
          git config user.email "${id}+${FLOWBOT_OWNER}@users.noreply.github.com"
      - name: 執行腳本任務
        if: steps.recheck.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
          TASK: ${{ toJSON(matrix.task) }}
        run: python3 .github/flow-bot/actions.py "$TASK"

  claude:
    needs: gate
    if: needs.gate.outputs.has_claude == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (matrix.task.kind == 'story_spec' || matrix.task.kind == 'story_impl') && 120 || 30 }}
    environment: flow-bot
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.gate.outputs.claude_tasks) }}
    concurrency:
      group: ${{ matrix.task.group }}
      cancel-in-progress: false
    steps:
      - name: 記錄開始時間
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/flow-bot
      - name: 再確認一次
        id: recheck
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
          TASK: ${{ toJSON(matrix.task) }}
        run: python3 .github/flow-bot/gate.py recheck
      - name: 找出要 checkout 的分支
        id: ref
        if: steps.recheck.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
          CHECKOUT: ${{ matrix.task.checkout }}
          PR: ${{ matrix.task.pr }}
        run: |
          if [ "$CHECKOUT" = "head" ]; then
            echo "ref=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.recheck.outputs.run == 'true'
        with:
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.FLOWBOT_PAT }}
          fetch-depth: 0
      - name: 設定 git 身分
        if: steps.recheck.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
        run: |
          id=$(gh api "users/$FLOWBOT_OWNER" --jq .id)
          git config user.name "$FLOWBOT_OWNER"
          git config user.email "${id}+${FLOWBOT_OWNER}@users.noreply.github.com"
      - uses: astral-sh/setup-uv@v6
        if: steps.recheck.outputs.run == 'true'
      - name: 執行任務
        if: steps.recheck.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.FLOWBOT_PAT }}
          prompt: >-
            使用 flow-bot skill（.claude/skills/flow-bot/SKILL.md）。
            任務：${{ matrix.task.kind }}；
            PR：${{ matrix.task.pr || '無' }}；
            Story：${{ matrix.task.story || '無' }}；
            OWNER：${{ env.FLOWBOT_OWNER }}；
            指示：${{ matrix.task.text || '無' }}；
            執行紀錄：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          claude_args: >-
            --max-turns 200
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,Task,Skill,TodoWrite"
            --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(gh pr merge:*),Bash(gh pr review:*)"
      - name: 檢查沒有送出任何核准
        if: always() && steps.recheck.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
          SINCE: ${{ steps.start.outputs.at }}
        run: python3 .github/flow-bot/guard.py
      - name: 上傳畫面截圖
        if: always() && hashFiles('e2e-screenshots/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.task.kind }}-${{ matrix.task.pr || matrix.task.story }}
          path: e2e-screenshots/
      - name: 關閉服務
        if: always()
        run: docker compose down -v 2>/dev/null || true

  # 審查別人的 PR：Claude 只拿到唯讀的 GITHUB_TOKEN，把結果寫成 JSON；
  # 送出 review 的是下一個 job 的腳本，event 寫死為 COMMENT。
  review:
    needs: gate
    if: needs.gate.outputs.has_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: flow-bot
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.gate.outputs.review_tasks) }}
    concurrency:
      group: flow-bot-review-${{ matrix.task.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: 審查
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: >-
            使用 flow-bot skill（.claude/skills/flow-bot/SKILL.md）。
            任務：review_others；PR：${{ matrix.task.pr }}；Story：無；
            OWNER：${{ env.FLOWBOT_OWNER }}；指示：無；
            執行紀錄：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Read,Write,Glob,Grep,Skill"
      - uses: actions/upload-artifact@v4
        with:
          name: flow-bot-review-${{ matrix.task.pr }}
          path: flow-bot-review.json

  post-review:
    needs: [gate, review]
    if: always() && needs.gate.outputs.has_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: flow-bot
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.gate.outputs.review_tasks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/flow-bot
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          name: flow-bot-review-${{ matrix.task.pr }}
      - name: 以 COMMENT 送出審查
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
          PR: ${{ matrix.task.pr }}
        run: python3 .github/flow-bot/post_review.py flow-bot-review.json

  status:
    needs: [gate, script, claude, post-review]
    if: >-
      always() && needs.gate.result == 'success' &&
      (needs.gate.outputs.has_script == 'true' || needs.gate.outputs.has_claude == 'true' || needs.gate.outputs.has_review == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: flow-bot
    concurrency:
      group: flow-bot-status
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github/flow-bot
      - name: 更新狀態 issue
        env:
          GH_TOKEN: ${{ secrets.FLOWBOT_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/flow-bot/status_issue.py
