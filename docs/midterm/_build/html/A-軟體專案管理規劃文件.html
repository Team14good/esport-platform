window.__DATA__ = {"meta":{"school":"國 立 中 央 大 學","school_en":"National Central University","department":"資 訊 管 理 所","course":"資訊系統專案設計","project":"電 競 賽 事 管 理 平 台（FLOW）","advisor":"許智誠 教授","leader":"黃鉅燊","members":["王閎立","蘇采羚","邱芯彤"],"date":"2026 年 11 月 18 日","group":"G14","docs":[{"file":"A-軟體專案管理規劃文件.md","title":"軟體專案管理規劃文件","title_en":"Software Project Management Plan"},{"file":"B-軟體需求分析文件.md","title":"軟體需求分析文件","title_en":"Software Requirements Specification"},{"file":"C-軟體設計文件.md","title":"軟體設計文件","title_en":"Software Design Document"},{"file":"D-物件設計文件.md","title":"物件設計文件","title_en":"Object Design Document"}]},"doc":{"file":"A-軟體專案管理規劃文件.md","title":"軟體專案管理規劃文件","title_en":"Software Project Management Plan"},"markdown":"# 版本紀錄\r\n\r\n| 版本 | 日期 | 修改內容 |\r\n| --- | --- | --- |\r\n| 1.0 | 2026-10-16 | 初版 |\r\n| 1.1 | 2026-10-19 | 依審閱意見修訂：統一用語，新增「尚未開放」狀態與學校清單，補充輪空、棄權期限、名額同分與取消資格規則 |\r\n| 1.2 | 2026-10-20 | 依一致性審查補充規則（重新比賽、退出與解散隊伍、改派裁判、學校選填）；年份改用西元年、改寫時程說明，分工改為四個角色；移除壓力測試；新增版本紀錄與參考文獻 |\r\n\r\n# 壹、專案簡介\r\n\r\n## 一、文件目的\r\n\r\n本文件是「電競賽事管理平台（FLOW）」的專案管理依據，界定專案的目的、範疇、利害關係人、成果物、時程、分工與風險，讓組員與教授對專案有一致的理解。本文件綜整產品簡介、產品需求文件（PRD）、架構骨幹與 Epic 規劃後撰寫，並與同期交付的《軟體需求分析文件》（B）、《軟體設計文件》（C）、《物件設計文件》（D）互相對應。\r\n\r\n本專案從 2026 年 10 月 11 日開始選題，到期末報告（12 月 16 日）約 9 週，時程緊湊。因此本文件特別強調「範疇收斂」：明確列出必做、加分與不做的項目，所有功能需求都有編號與可測結果，避免開發途中範疇蔓延；同時把定時規則、併發控制、操作紀錄等高風險設計提早定案，讓後續開發與測試有一致的依據。\r\n\r\n## 二、系統背景與問題定義\r\n\r\n校際與社群的電競盃賽越來越多，但主辦方（多半是學生社團）仍靠 PDF 規程、Google 表單、Excel、FB 公告、Discord 頻道與 email 申訴書，才能把一場比賽辦完。以 2024 年第六屆大專盃電競錦標賽特戰英豪項目的規程為例（參考文獻 1），一場 64 隊的比賽需要大量人工作業，具體問題如下：\r\n\r\n1. **報名審核靠人工計算**\r\n   同校有多支隊伍報名時，規程以選手段位積分平均決定學校代表隊，全由主辦方逐筆計算，容易出錯也難以公開說明。\r\n2. **抽籤與賽程分散在公告裡**\r\n   抽籤結果貼在 FB，選手要自己去找對手是誰、幾點打；賽程異動時也只能再發公告。\r\n3. **檢錄與遲到判定靠人工計時**\r\n   規程要求賽前進入 Discord 頻道報到，超過 15 分鐘未開打判棄權，全靠裁判盯著時間。\r\n4. **結果與證據分開保存**\r\n   比分由裁判手記，結算截圖由選手「自行存證」，兩者沒有綁在一起，發生爭議時難以查證。\r\n5. **申訴流程笨重且無法追蹤**\r\n   申訴須在比賽結束後 30 分鐘內以 email 寄出申訴書，處理進度無從得知，處理理由也沒有統一保存。\r\n\r\n主辦方是最大的受害者：每多一隊報名，人工工作就多一份，出錯時也最難追查。社群與系上的小型比賽人力更少，問題只會更嚴重。\r\n\r\n因此，本專案要建立一個網頁平台，把「開賽事 → 報名與名額分配 → 抽籤 → 報到 → 比分登錄 → 申訴與檢舉 → 晉級與觀賽」整條流程收進同一個系統，每一步都留下操作者與時間紀錄。系統以《英雄聯盟》與《特戰英豪》為示範，但各遊戲的差異（每隊人數、幾戰幾勝、段位對照、比分型態）都做成設定，任何「兩隊對打、分出勝負」的遊戲都能使用。\r\n\r\n## 三、利害關係人\r\n\r\n本系統的使用者共有六種身分。其中「隊長」是帳號在某支隊伍裡的身分、「裁判」是帳號在某個賽事裡的身分，都不是獨立的帳號類型；同一個帳號可以在一隊當隊長、在另一隊只是選手，也可以同時是主辦方。以下整理各身分的需求與關注點。\r\n\r\n### （一）主辦方\r\n\r\n主辦方是本系統的主要服務對象，通常是學生電競社團的幹部，需求包含：\r\n\r\n1. 以最少的人工建立賽事、收報名，並由系統自動完成名額分配與抽籤。\r\n2. 檢視報名隊伍的段位截圖，退回造假或不合格的報名。\r\n3. 處理申訴與資格檢舉，並在發生爭議時拿出完整的操作紀錄。\r\n4. 抽籤後指派裁判、調整場次時間。\r\n\r\n主辦方最在乎的是「少做人工」、「規則一致」與「出事查得到」。\r\n\r\n### （二）裁判\r\n\r\n裁判由主辦方邀請，負責被指派場次的比分登錄，需求包含：\r\n\r\n1. 在同一個頁面看到兩隊的報到狀態，確認可以開始比賽。\r\n2. 每打完一局就登錄比分，不必另外抄寫。\r\n3. 系統自動算出系列結果，核對後送出並鎖定。\r\n\r\n裁判重視「操作快速」與「結果正確」。\r\n\r\n### （三）隊長與選手\r\n\r\n隊長負責組隊、報名、報到與申訴；選手負責提供自己的遊戲 ID 與段位。需求包含：\r\n\r\n1. 用邀請連結找齊隊員，在同一個地方完成報名，並立刻知道是正取還是候補。\r\n2. 清楚知道下一場的對手與時間，不必翻找 FB 與 Discord。\r\n3. 比分有誤或懷疑他隊資格不符時，有正式的線上管道申訴或檢舉。\r\n\r\n隊長與選手最在乎「資訊透明」與「權益有保障」。\r\n\r\n### （四）觀眾\r\n\r\n觀眾是參賽學校的同學或社群玩家，不需註冊。需求是用手機打開賽事頁，就能看到視覺化對戰樹、每局比分，以及誰晉級、誰淘汰。觀眾重視「不用登入」與「即時更新」。\r\n\r\n### （五）平台管理員\r\n\r\n平台管理員負責審核主辦方申請，只讓真實存在的社團取得主辦方權限，並維護遊戲清單、預設值與學校清單。平台管理員重視「新增遊戲不用改程式」與「主辦方身分可信」。\r\n\r\n### （六）利害關係人與責任矩陣\r\n\r\n| 利害關係人 | 在專案中的角色 | 權限與職責 |\r\n| --- | --- | --- |\r\n| 教授 | 專案指導與評分 | 審閱各階段文件與成果，確認流程符合軟體工程要求 |\r\n| 平台管理員 | 系統使用者 | 審核主辦方申請、維護遊戲設定與學校清單 |\r\n| 主辦方 | 系統主要使用者 | 建立與管理賽事、審核報名、處理申訴與檢舉、邀請與指派裁判 |\r\n| 裁判 | 系統使用者 | 登錄被指派場次的比分並送出系列結果 |\r\n| 隊長 | 系統使用者 | 組隊、送出報名、報到、上傳結算截圖、申訴與檢舉 |\r\n| 選手 | 系統使用者 | 填寫遊戲 ID、段位與段位截圖 |\r\n| 觀眾 | 系統使用者（不登入） | 瀏覽賽事、對戰樹與比分 |\r\n| 專案開發團隊 | 開發者 | 需求分析、設計、實作、測試、文件與展示 |\r\n\r\n# 貳、專案範疇\r\n\r\n## 一、功能清單\r\n\r\n本專案的功能依「開賽事 → 報名 → 抽籤 → 比賽 → 申訴 → 觀賽」的流程，按使用者身分整理如下。功能需求統一編號為 FR-1～FR-41，每條的完整敘述與可測結果見《軟體需求分析文件》的附錄。\r\n\r\n### （一）帳號端功能\r\n\r\n所有註冊的帳號都能使用以下功能，不論之後是否成為主辦方、裁判或隊長。\r\n\r\n1. **註冊與登入**（FR-1、FR-40）\r\n   - 以 Email 與密碼註冊並完成 Email 驗證，學校為選填、從學校清單選擇（參加校園賽時必須設定）；忘記密碼時以 Email 重設。\r\n2. **申請成為主辦方**（FR-2）\r\n   - 填寫社團名稱、選擇學校送出申請，等待平台管理員審核。\r\n3. **通知中心**（FR-38）\r\n   - 查看站內通知與未讀數，點開導向相關頁面。\r\n\r\n### （二）平台管理員端功能\r\n\r\n1. **審核主辦方申請**（FR-3）\r\n   - 檢視待審核的申請（社團名稱、學校），核准或附原因退回。\r\n   - 核准後申請人立即取得建立賽事的權限。\r\n2. **維護遊戲設定與學校清單**（FR-6）\r\n   - 新增或修改遊戲的先發人數、替補人數、預設 BO 數、每局預估時間、段位積分對照表與比分型態。\r\n   - 修改預設值不影響已建立的賽事。\r\n   - 維護學校清單，讓帳號、主辦方申請與報名的學校名稱一致。\r\n\r\n### （三）主辦方端功能\r\n\r\n1. **建立與管理賽事**（FR-7～FR-10、FR-39）\r\n   - 選擇遊戲後自動帶入預設值，填寫名額、報名期間、優先期、開賽日期、每輪間隔、棄權時限、申訴期與賽事模式（校園賽或自訂）。\r\n   - 為不同輪次設定 BO 數（抽籤前都可修改）；抽籤前可延長報名、提高名額（候補立即遞補）；可取消尚未結束的賽事。\r\n2. **審核報名**（FR-18）\r\n   - 檢視段位截圖，附原因退回不合格的報名。\r\n3. **抽籤與賽程**（FR-4、FR-19、FR-23）\r\n   - 報名截止自動抽籤，或在截止前提前抽籤；系統自動排定場次時間，主辦方可個別調整。\r\n   - 產生裁判邀請連結，並把裁判指派到場次；一位裁判可負責多個場次，但不會被指派到自己隊伍的場次；送出系列結果前可以改派或收回指派。\r\n4. **處理爭議**（FR-31、FR-33）\r\n   - 對申訴維持或更正結果（棄權判定錯誤時可安排重新比賽）；對檢舉駁回或取消該隊資格，皆須附理由。\r\n5. **查閱操作紀錄**（NFR-3）\r\n   - 查閱自己賽事的所有操作紀錄（操作者、時間、變更前後內容）。\r\n\r\n### （四）裁判端功能\r\n\r\n1. **登錄比分**（FR-26）：依遊戲的比分型態，逐局登錄勝隊或回合比分。\r\n2. **送出系列結果**（FR-27）：系統依各局結果算出系列比分，裁判核對後送出並鎖定，場次進入申訴期；申訴期滿無人申訴，結果才確認。\r\n\r\n### （五）隊長與選手端功能\r\n\r\n1. **組隊與報名**（FR-11～FR-13、FR-41）\r\n   - 建立隊伍、以邀請連結邀請隊員；名單鎖定前隊長可移除隊員、轉讓隊長或解散隊伍，隊員也可以自行退出。\r\n   - 選手填寫遊戲 ID、段位並上傳段位截圖；隊長送出報名後名單鎖定。\r\n2. **查看分配結果**（FR-14～FR-17）\r\n   - 立即或在優先期結束後看到正取或候補，候補隊伍可看到自己的候補順位。\r\n   - 第一場開打前可退賽，由候補遞補。\r\n3. **比賽當天**（FR-24、FR-28）\r\n   - 開賽前 30 分鐘起報到；勝隊隊長上傳結算截圖作為佐證。\r\n4. **申訴與檢舉**（FR-30、FR-32）\r\n   - 在申訴期內對場次結果提出申訴；賽事結束前對他隊資格提出檢舉。\r\n\r\n### （六）觀眾端功能\r\n\r\n1. **公開賽事頁**（FR-34）：不登入就能瀏覽賽事列表、賽事資訊與正取隊伍。\r\n2. **視覺化對戰樹**（FR-35）：手機上可閱讀的單淘汰對戰樹，場次確認後 10 秒內更新，可搜尋隊伍並顯示晉級路徑。\r\n3. **場次頁**（FR-36）：查看每一局的比分與場次目前狀態。\r\n\r\n### （七）系統自動處理\r\n\r\n1. **名額分配**（FR-14～FR-16）：校園賽依「優先期 → 先搶期 → 截止補位」三階段自動分配正取與候補；自訂賽事依送出先後分配。\r\n2. **定時規則**（FR-7、FR-19、FR-25、FR-29、FR-31）：報名開始時自動開放報名、報名截止自動抽籤、第一個場次開放報到時賽事轉為進行中、逾時判棄權、申訴期滿自動確認並晉級、申訴快逾期時提醒主辦方。\r\n3. **對戰表推進**（FR-20～FR-22）：產生含輪空與季軍賽的單淘汰對戰表，勝隊自動晉級，對手位置確定沒有隊伍時以輪空晉級；隊伍被取消資格時依規則頂替。\r\n4. **權限控管**（FR-5）：依帳號在每個賽事、每支隊伍中的身分決定可執行的操作，全部在伺服器端檢查。\r\n5. **通知**（FR-37）：重要事件同時發送站內通知與 Email。\r\n\r\n## 二、非功能清單\r\n\r\n非功能需求是系統穩定、公平與可信的基本條件。本系統最重要的是「搶名額不超收」與「規則自動且準時執行」，主要分為以下六類：\r\n\r\n### （一）效能需求\r\n\r\n1. **回應時間**（NFR-2）\r\n   - 一般操作（瀏覽賽事與對戰樹、送出報名、登錄比分）的 API 在 1 秒內回應，以整合與端對端測試量測。\r\n2. **觀賽更新**（FR-35）\r\n   - 場次變為「已確認」後，開著頁面的觀眾在 10 秒內看到對戰樹更新。\r\n\r\n### （二）一致性與可靠度\r\n\r\n1. **併發一致性**（NFR-1）\r\n   - 多支隊伍同時送出報名時，正取隊數不超過名額，不產生重複的正取或遺失的報名；以真的 PostgreSQL 執行併發整合測試驗證。\r\n   - 同一場次的比分不會因同時操作而互相覆蓋。\r\n2. **定時規則可靠**（NFR-4）\r\n   - 報名開始、優先期結束、報名截止、賽事開始、棄權判定、申訴期滿與申訴逾期提醒，即使沒有人操作，也在預定時間後 1 分鐘內自動執行。\r\n\r\n### （三）安全與個資保護\r\n\r\n1. **權限在伺服器端檢查**（NFR-5）：所有權限都在後端驗證，繞過介面直接呼叫 API 也會被拒絕。\r\n2. **個資保護**（NFR-6）：密碼雜湊保存；Email、學校與段位截圖不出現在公開頁面。\r\n3. **操作紀錄**（NFR-3）：報名、名額分配、抽籤、比分、申訴、檢舉、取消資格與時間修改都記錄操作者、時間、所屬賽事與變更前後內容，紀錄不可修改或刪除。\r\n\r\n### （四）使用性\r\n\r\n1. **手機可用**（NFR-7）：所有頁面在 375 px 寬的手機上可操作。\r\n2. **繁體中文介面**：介面文字一律使用繁體中文。\r\n\r\n### （五）可維護性與擴充性\r\n\r\n1. **模組化架構**：後端依功能切成 6 個業務模組，模組內分 Router、Service、Repository 三層，模組之間只透過 Service 公開介面溝通。\r\n2. **遊戲可擴充**（NFR-9）：新增遊戲只需在後台設定，不需修改程式。\r\n\r\n### （六）可部署性\r\n\r\n1. **一鍵啟動**（NFR-8）：以 docker compose 一個指令啟動全部服務，並自動載入示範資料（2 款遊戲、學校清單、32 隊賽事）。\r\n\r\n## 三、範疇界定\r\n\r\n為了在時程內完成，專案範疇分為必做、加分與不做三類。加分項目只有在必做功能完成且測試通過後才會考慮。\r\n\r\n| 類別 | 項目 |\r\n| --- | --- |\r\n| 必做 | 帳號與身分權限、主辦方申請審核、遊戲設定、建隊與名單鎖定、報名與三階段名額分配、搶名額不超收、抽籤產生單淘汰對戰表（含輪空與季軍賽）、賽前報到與逾時判棄權、裁判逐局登錄比分、結算截圖、限時申訴與主辦方處理、資格檢舉與取消資格頂替、自動晉級、視覺化對戰樹、站內通知與 Email |\r\n| 加分 | 選手 KDA 與個人戰績、串接《英雄聯盟》官方 API 自動帶入比分、雙敗制或循環賽、手機推播、《特戰英豪》地圖選取流程 |\r\n| 不做 | 必須依賴遊戲官方 API 才能運作的功能、直播（只放連結）、報名費與獎金金流、防作弊、大逃殺類遊戲、帶隊老師角色、原生手機 App |\r\n\r\n## 四、成果物清單\r\n\r\n本專案依課程要求交付三類成果物：文件成果物、系統實作成果物與展示成果物。\r\n\r\n### （一）文件成果物\r\n\r\n| 代號 | 文件 | 主要內容 | 交付時間 |\r\n| --- | --- | --- | --- |\r\n| A | 軟體專案管理規劃文件 | 背景與問題、利害關係人、範疇、成果物、時程、分工、風險 | 期中 |\r\n| B | 軟體需求分析文件 | Epic 與 User Story、功能清單、非功能需求、使用案例圖、核心使用案例規格、泳道圖、狀態圖、ERD、資料表說明、類別圖、循序圖、功能需求規格（FR-1～41 與可測結果） | 期中 |\r\n| C | 軟體設計文件 | 系統架構圖、分層架構、模組劃分、關鍵機制、介面設計、部署與技術選型、設計理由、設計決策（AD）一覽 | 期中 |\r\n| D | 物件設計文件 | 各模組類別圖、類別職責、模組協作與設計原則 | 期中 |\r\n| E | 測試計畫 | 測試目的、範圍、方法（單元、整合、端對端）、環境與工具 | 期末 |\r\n| F | 專案測試報告 | 測試個案與結果、覆蓋率、端對端腳本與回應時間量測 | 期末 |\r\n| G | AI 應用文件 | 各開發階段的 AI 使用說明、Prompt、AI 回覆與團隊的篩選修改 | 期末 |\r\n\r\n### （二）系統實作成果物\r\n\r\n1. 前端單頁應用（React）：公開賽事頁與對戰樹、帳號與通知中心、隊伍與報名、裁判場次頁、主辦方後台、平台管理後台。\r\n2. 後端 API（FastAPI）：identity、tournaments、registration、competition、disputes、notifications 六個模組。\r\n3. 背景工作程序（worker）：定時規則（報名開始、優先期結束、報名截止、賽事開始、判棄權、申訴期滿、申訴逾期提醒）與通知寄送。\r\n4. 資料庫 Schema（PostgreSQL）與 Alembic 遷移檔。\r\n5. docker compose 設定：db、backend、worker、frontend、mailpit 五個服務，一鍵啟動並載入示範資料。\r\n6. 自動化測試：pytest 單元與整合測試（含以真 PostgreSQL 執行的併發測試）、Playwright 端對端測試。\r\n\r\n### （三）最終展示成果物\r\n\r\n1. 期中與期末簡報。\r\n2. 實際操作 Demo：以《英雄聯盟》與《特戰英豪》各跑一場完整賽事。\r\n3. Demo 影片：錄製從開賽事、報名、抽籤、比賽、申訴到頒獎的完整流程。\r\n4. 專案整合包：所有文件、程式碼、測試結果與 AI 使用紀錄。\r\n\r\n# 參、專案時程規劃\r\n\r\n## 一、開發方法\r\n\r\n本專案採用 BMAD Method（AI 輔助的敏捷開發流程，參考文獻 2），依「分析 → 規劃 → 方案設計 → 實作」四個階段進行，每個階段的產出都存放在專案資料夾，作為下一階段的輸入：\r\n\r\n| 階段 | 主要產出 | 狀態 |\r\n| --- | --- | --- |\r\n| 分析 | 專案背景說明、候選題目比較、產品簡介 | 已完成（10/11～10/14） |\r\n| 規劃 | 產品需求文件（FR-1～41、NFR-1～9）、UX 設計（DESIGN.md、EXPERIENCE.md） | 已完成（10/14～10/15） |\r\n| 方案設計 | 架構骨幹（AD-1～21）、C／D 打底稿、Epic 與 User Story（7 個 Epic、50 個 Story）、Sprint 規劃 | 已完成（10/14～10/15） |\r\n| 實作 | 依 Story 逐一開發、程式審查、測試 | 10/19 起 |\r\n\r\n實作階段以 Story 為單位：開發 → 程式審查 → 單元與整合測試 → 標記完成，進度記錄在 sprint-status.yaml。各階段與 AI 的對話（Prompt 與回覆）全程保留，作為期末 G 文件的素材。\r\n\r\n## 二、里程碑\r\n\r\n| 編號 | 日期 | 里程碑 | 驗收方式 |\r\n| --- | --- | --- | --- |\r\n| M1 | 10/15 | 規劃與設計文件定稿 | PRD、架構骨幹、Epic 皆為定稿狀態 |\r\n| M2 | 11/01 | 系統骨架與帳號功能完成 | docker compose 一鍵啟動，可註冊、登入、收驗證信 |\r\n| M3 | 11/18 | 期中報告 | 交付 A～D 文件與期中簡報 |\r\n| M4 | 11/26 | 報名到對戰表可展示 | 可完成建立賽事、報名分配、抽籤並顯示對戰樹 |\r\n| M5 | 12/07 | 必做功能全部完成 | Epic 1～6 的 Story 全部完成並通過測試 |\r\n| M6 | 12/11 | 整體驗收完成 | 兩款遊戲在桌機與手機上的端對端演練通過 |\r\n| M7 | 12/16 | 期末報告 | 交付 E～G 文件、系統、Demo 影片與期末簡報 |\r\n\r\n## 三、甘特圖\r\n\r\n以下為預定時程。各 Epic 的開發期間互相重疊，是因為前一個 Epic 的收尾（測試與修正）和下一個 Epic 的開工同時進行；實際進度依組內分工與每週檢討調整。\r\n\r\n```mermaid\r\ngantt\r\n  title 電競賽事管理平台 專案時程（2026 年）\r\n  dateFormat YYYY-MM-DD\r\n  axisFormat %m/%d\r\n  todayMarker off\r\n  tickInterval 1week\r\n  weekday monday\r\n  section 分析與規劃\r\n  選題與提案比較         :done, a1, 2026-10-11, 3d\r\n  產品簡介與 PRD         :done, a2,       const fig = document.createElement('div');
      fig.className = 'figure';
      fig.dataset.key = 'usecase-' + i;
      try {
        fig.innerHTML = window.renderUseCase(code.textContent, Math.floor(maxW));
        fit(fig.querySelector('svg'), '使用案例圖');
      } catch (err) {
        fig.classList.add('error');
        fig.textContent = '使用案例圖錯誤：' + err.message;
        window.__ERRORS__.push('ERROR 使用案例圖：' + err.message);
      }
      code.parentElement.replaceWith(fig);
    }
    // 以圖檔引用的使用案例圖與泳道圖：PDF 排入向量圖，並另存 PNG 給 Markdown 預覽使用
    const toPng = async (svg) => {
      const vb = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
      const w = Number(vb[1]);
      const h = Number(vb[2]);
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * 2);
      canvas.height = Math.round(h * 2);
      const g = canvas.getContext('2d');
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, canvas.width, canvas.height);
      g.drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/png');
    };
    for (const img of [...content.querySelectorAll('img[data-figure]')]) {
      const m = img.getAttribute('data-figure').match(/^figures\/([\w.-]+)\.png$/);
      if (!m || !figures[m[1]]) continue;
      const { kind, src } = figures[m[1]];
      const label = kind === 'usecase' ? '使用案例圖' : '泳道圖';
      const fig = document.createElement('div');
      fig.className = 'figure';
      fig.dataset.key = 'img-' + m[1];
      try {
        const svg = kind === 'usecase' ? window.renderUseCase(src, Math.floor(maxW)) : window.renderSwimlane(src, Math.floor(maxW));
        window.__FIGURE_PNGS__[m[1]] = await toPng(svg);
        fig.innerHTML = svg;
        fit(fig.querySelector('svg'), label + ' ' + m[1]);
      } catch (err) {
        fig.classList.add('error');
        fig.textContent = label + '錯誤（' + m[1] + '）：' + err.message;
        window.__ERRORS__.push('ERROR ' + label + ' ' + m[1] + '：' + err.message);
      }
      const p = img.parentElement;
      (p.tagName === 'P' && p.childElementCount === 1 && !p.textContent.trim() ? p : img).replaceWith(fig);
    }
    const blocks = [...content.querySelectorAll('pre > code.language-mermaid')];
    for (let i = 0; i < blocks.length; i++) {
      const code = blocks[i].textContent;
      const fig = document.createElement('div');
      fig.className = 'figure';
      fig.dataset.key = 'mermaid-' + i;
      try {
        const { svg } = await mermaid.render('mmd' + i, code, box);
        fig.innerHTML = svg;
        fit(fig.querySelector('svg'), '圖 #' + (i + 1) + '（' + code.split('\n')[0] + '）');
      } catch (err) {
        fig.classList.add('error');
        fig.textContent = 'Mermaid 錯誤（圖 #' + (i + 1) + '）：' + (err && err.message ? err.message : err);
        window.__ERRORS__.push('ERROR 圖 #' + (i + 1) + '：' + (err && err.message ? err.message : err));
      }
      blocks[i].parentElement.replaceWith(fig);
      box.innerHTML = '';
    }

    // 4. 封面與目錄
    const members = meta.members.map((m, i) =>
      '<div class="row"><span class="label">' + (i === 0 ? '組 員' : '') + '</span><span>' + (i === 0 ? '：' : '　') + esc(m) + '</span></div>').join('');
    const cover = '<section class="cover">' +
      '<div class="school">' + esc(meta.school) + '</div>' +
      '<div class="school-en">' + esc(meta.school_en) + '</div>' +
      '<div class="dept">' + esc(meta.department) + '</div>' +
      '<div class="course">' + esc(meta.course) + '</div>' +
      '<div class="title">' + esc(doc.title) + '</div>' +
      '<div class="title-en">' + esc(doc.title_en) + '</div>' +
      '<div class="info">' +
        '<div class="row"><span class="label">題 目</span><span>：' + esc(meta.project) + '</span></div>' +
        '<div class="row"><span class="label">授課教授</span><span>：' + esc(meta.advisor) + '</span></div>' +
        '<div class="row"><span class="label">組 長</span><span>：' + esc(meta.leader) + '</span></div>' +
        members +
      '</div>' +
      '<div class="date">' + esc(meta.date) + '</div>' +
      '</section>';
    const toc = '<section class="toc"><h1 class="toc-title">目錄</h1>' + heads.map((h) =>
      '<div class="entry l' + h.tagName[1] + '"><span class="text">' + esc(h.textContent) + '</span><span class="dots"></span><span class="num" data-for="' + h.id + '"></span></div>').join('') + '</section>';

    const stage = document.getElementById('stage');
    stage.innerHTML = cover + toc;
    stage.appendChild(content);

    // 5. 分頁
    // 先移出頁面：Paged.js 會把文件中所有 style 元素當成樣式表處理，SVG 內的 style 會讓它出錯
    const html = stage.innerHTML;
    stage.remove();
    box.remove();
    await window.PagedPolyfill.preview(html, undefined, document.body);

    // 6. 頁碼（內文從第 1 頁起算，封面與目錄不編頁碼）與目錄頁碼
    const pages = [...document.querySelectorAll('.pagedjs_page')];
    const firstH1 = document.getElementById('h0');
    const firstContent = firstH1 ? pages.indexOf(firstH1.closest('.pagedjs_page')) : 0;
    const total = pages.length - firstContent;
    pages.forEach((p, i) => {
      if (i < firstContent) return;
      const f = document.createElement('div');
      f.className = 'page-footer';
      f.textContent = '第 ' + (i - firstContent + 1) + ' 頁，共 ' + total + ' 頁';
      p.appendChild(f);
    });
    document.querySelectorAll('.toc .num').forEach((n) => {
      const target = document.getElementById(n.dataset.for);
      const page = target && target.closest('.pagedjs_page');
      if (page) n.textContent = String(pages.indexOf(page) - firstContent + 1);
    });
    window.__PAGES__ = pages.length;
  } catch (err) {
    window.__ERRORS__.push('ERROR 排版失敗：' + describe(err));
  }
  window.__DONE__ = true;
})();
</script>
</body>
</html>
