window.__DATA__ = {"meta":{"school":"國 立 中 央 大 學","school_en":"National Central University","department":"資 訊 管 理 所","course":"資訊系統專案設計","project":"電 競 賽 事 管 理 平 台（FLOW）","advisor":"許智誠 教授","leader":"王閎立 115423080","members":["黃鉅燊 115423045","蘇采羚 115423051","邱芯彤 115423037"],"date":"2026 年 11 月 18 日","group":"G14","docs":[{"file":"A-軟體專案管理規劃文件.md","title":"軟體專案管理規劃文件","title_en":"Software Project Management Plan"},{"file":"B-軟體需求分析文件.md","title":"軟體需求分析文件","title_en":"Software Requirements Specification"},{"file":"C-軟體設計文件.md","title":"軟體設計文件","title_en":"Software Design Document"},{"file":"D-物件設計文件.md","title":"物件設計文件","title_en":"Object Design Document"}]},"doc":{"file":"B-軟體需求分析文件.md","title":"軟體需求分析文件","title_en":"Software Requirements Specification"},"markdown":"# 版本紀錄\n\n| 版本 | 日期 | 修改內容 |\n| --- | --- | --- |\n| 1.0 | 2026-10-16 | 初版 |\n| 1.1 | 2026-10-19 | 依審閱意見修訂：統一用語，新增「尚未開放」狀態與學校清單，補充輪空、棄權期限、名額同分與取消資格規則 |\n| 1.2 | 2026-10-20 | 依一致性審查補充規則（重新比賽、退出與解散隊伍、改派裁判、學校選填），並修正使用案例圖、狀態圖與 ERD；移除壓力測試（刪除原 Story 7.2、7.3，原 7.4、7.5 改為 7.2、7.3），NFR-1、NFR-2 改以整合與端對端測試驗證；新增版本紀錄與參考文獻 |\n| 1.3 | 2026-10-23 | 截止補位改由所有候補依平均段位積分補位、每校最多 2 隊，與報名截止後的遞補順序相同（名詞表、Story 3.6、功能說明 3.7、使用案例例外流程 5a、附錄 4.3 與 FR-16） |\n| 1.4 | 2026-10-28 | 依 Epic 1 實作定案的規則補充 FR-1（密碼長度、重寄驗證信、登入 7 天與過期處理）、FR-40（重設後登出其他裝置、視為完成驗證）；資料表補上 ACCOUNT.credentials_version、EMAIL_DELIVERY.next_attempt_at、AUDIT_LOG.seq |\n\n# 壹、系統整體概述\n\n本章界定「電競賽事管理平台（FLOW）」的定位、使用者類型與系統邊界，作為後續功能需求、流程分析與資料規格的共同基礎。專案目標、利害關係人分析與時程請見《軟體專案管理規劃文件》。\n\n## 一、系統定位\n\n電競賽事管理平台是給校際與社群中小型電競盃賽使用的一站式網頁系統。它把賽事從「開放報名」到「產生冠亞季軍」的完整流程收進同一個系統：主辦方開賽事、審報名、抽籤；系統自動分配名額、排定賽程、判定棄權與晉級；裁判登錄比分；隊長報到、申訴與檢舉；觀眾不登入就能看到視覺化對戰樹。\n\n系統只支援「兩隊對打、分出勝負」的遊戲，賽制為單淘汰（含季軍賽）。各遊戲的差異（每隊先發與替補人數、BO 數、每局預估時間、段位積分對照、比分型態）都是平台管理員維護的設定，不寫死在程式裡；第一版以《英雄聯盟》與《特戰英豪》示範。比分一律由裁判登錄，不依賴任何遊戲官方 API。\n\n## 二、使用者類型\n\n本系統的使用者依權限分為六種身分。帳號是唯一的登入單位，「主辦方」「平台管理員」是帳號上的權限，「裁判」與「隊長」則是帳號在特定賽事或隊伍中的身分：\n\n1. **平台管理員**：審核主辦方申請、維護遊戲設定與學校清單。擁有平台層級的管理權限，但不介入個別賽事的運作。\n2. **主辦方**：主辦方申請被核准的帳號。可建立賽事、審核報名、抽籤、指派裁判、處理申訴與檢舉；權限只及於自己建立的賽事，且不能在自己主辦的賽事參賽。\n3. **裁判**：受主辦方邀請、在某一賽事中負責登錄比分的帳號。裁判身分只在該賽事有效，且只能登錄被指派的場次；裁判可以同時參賽，但不會被指派到自己隊伍的場次。\n4. **隊長**：建立隊伍的帳號在該隊伍中的身分。負責邀請隊員、送出報名、報到、上傳結算截圖、申訴與檢舉；名單鎖定前可轉讓給隊員。\n5. **選手**：隊伍中的帳號。須填寫該遊戲的遊戲 ID、段位與段位截圖。同一帳號可以在一隊是隊長、在另一隊只是選手。\n6. **觀眾**：未登入、只瀏覽公開頁面的訪客，所有寫入操作都會被拒絕。\n\n## 三、系統邊界\n\n### （一）系統內部邊界\n\n系統內部負責的範圍包含：\n\n1. **帳號與身分**：註冊、Email 驗證、登入、重設密碼、主辦方申請與審核、裁判邀請，以及依身分控管權限。\n2. **賽事建立與遊戲設定**：遊戲清單與預設值、學校清單、賽事建立與修改、賽事模式（校園賽、自訂）、分輪 BO 數、取消賽事。\n3. **隊伍與報名**：組隊與邀請、選手參賽資料、送出報名與鎖定名單、三階段名額分配、候補順位與遞補、退回報名。\n4. **抽籤與對戰表**：抽籤、產生含輪空與季軍賽的單淘汰對戰表、排定場次時間、晉級推進、取消資格後的頂替。\n5. **場次進行**：報到、逾時判棄權、逐局登錄比分、送出系列結果、結算截圖、申訴期滿自動確認。\n6. **申訴與檢舉**：提出與處理申訴、提出與查證檢舉、取消資格。\n7. **觀賽與通知**：公開賽事頁、視覺化對戰樹、場次頁、站內通知與 Email 通知。\n8. **操作紀錄**：所有影響結果的操作都記錄操作者、時間與變更前後內容，且不可修改或刪除。\n\n### （二）系統外部邊界\n\n本系統不處理且不負責的範圍包含：\n\n1. **遊戲官方 API**：不串接 Riot 等官方 API 取得比分或驗證帳號（VALORANT API 需 Riot 審核且須玩家授權，參考文獻 2）；比分一律由裁判登錄。\n2. **直播**：不提供直播功能，賽事頁只放主辦方填寫的直播連結。\n3. **金流**：不處理報名費與獎金。\n4. **防作弊與在學資格審核**：不偵測作弊、不查驗學籍；資格問題以「檢舉 → 主辦方查證」處理。\n5. **其他賽制與遊戲類型**：不支援雙敗制、循環賽，也不支援大逃殺等多隊同場的遊戲。\n6. **正式寄信服務**：第一版的 Email 寄到本機測試信箱 Mailpit，不對外寄送。\n\n## 四、名詞定義\n\n本文件與其他文件一律使用以下名詞，不使用同義詞。\n\n| 名詞 | 定義 |\n| --- | --- |\n| 功能群 | 依系統功能劃分的需求分組（1.0～7.0）。功能群是需求面的分類，與後端的程式模組（identity、tournaments 等）不是同一件事，兩者的對應見貳、二 |\n| 賽事模式 | 建立賽事時選定、開放報名後不可更改的報名規則。**校園賽**要求同隊同校，名額依三階段分配；**自訂**採邀請制報名、不限學校、先到先得 |\n| 段位積分 | 依遊戲的對照表把段位換算成的分數；同校多隊時以名單的平均段位積分決定正取 |\n| 平均段位積分 | 名單上所有成員（先發與替補）段位積分的平均，取到小數第二位 |\n| 優先期 | 校園賽開放報名後的第一段期間（預設 1 天），只收報名、不分配名額；結束時各校平均段位積分最高的一隊成為代表隊 |\n| 先搶期 | 優先期結束到報名截止；優先期沒有報名（優先期結束時沒有「已送出・待分配」的報名）、且目前沒有正取的學校，第一支送出報名的隊伍取得正取，直到名額用完 |\n| 截止補位 | 報名截止時名額仍有剩，由候補依平均段位積分補位，每校最多 2 隊 |\n| 正取／候補 | 報名的分配結果。正取隊伍釋出名額時，由候補依當下階段的規則遞補 |\n| 候補順位 | 介面上「候補第 N 位」的 N，表示接下來陸續釋出名額時，這支候補隊伍是第幾個會被遞補的 |\n| 對戰表 | 一個賽事的單淘汰對戰樹 |\n| 場次 | 對戰表中兩支隊伍的一次對決，以 BO 數決定勝負；BO 數限 1、3、5、7 |\n| 局 | 場次中的一局比賽 |\n| 系列結果 | 由各局比分算出的場次結果，例如 2:1 |\n| 送出系列結果 | 裁判（或代登的主辦方）核對各局後鎖定比分的動作；送出後場次進入申訴期，結果尚未確認 |\n| 已確認 | 場次結果定案的狀態：申訴期滿無申訴、申訴處理完成、輪空或一方被取消資格時進入，勝隊在此時晉級。本文件的「確認」只指進入這個狀態 |\n| 報到 | 隊長在場次預定開始前 30 分鐘起，為自己的隊伍按下「報到」；場次兩隊都確定後才開放 |\n| 棄權 | 過了棄權期限仍未報到，該隊被判負。棄權期限為「預定開始時間」與「兩隊都確定的時間」較晚者，再加上棄權時限（預設 15 分鐘，主辦方只能延長） |\n| 輪空 | 隊伍不經比賽直接晉級：第一輪隊伍數不是 2 的次方時的輪空，以及對手位置確定不會有隊伍（前一場雙方棄權，或退賽、取消資格後無人遞補）時的輪空 |\n| 申訴期 | 裁判送出系列結果或判棄權後的一段時間（預設 30 分鐘，主辦方只能延長）；期間內無申訴，場次自動變為已確認 |\n| 申訴 | 隊長在申訴期內對場次結果提出的異議，由主辦方維持或更正；對棄權判定也可以安排重新比賽 |\n| 檢舉 | 隊長對另一支隊伍參賽資格提出的質疑，由主辦方查證 |\n| 取消資格 | 主辦方查證檢舉屬實後對隊伍的處分 |\n| 退賽 | 隊伍在第一場開打前主動退出；抽籤前退賽等同撤回報名 |\n\n# 貳、需求規格\n\n## 一、功能需求分析\n\n本節依 Epic 與 User Story 描述各身分在系統中可執行的行為。Epic 是依開發順序切分的工作單位，共 7 個 Epic、50 個 User Story。每個 Story 實作的功能需求列在功能清單（貳、二），功能需求的完整敘述與可測結果列在附錄（肆）；Story 的 Given／When／Then 驗收條件由這些可測結果展開，將整理進期末的《測試計畫》作為測試個案。\n\n### （一）Epic 1：平台基礎、帳號與通知中心\n\n建立可一鍵啟動的系統骨架與共用元件；訪客能註冊、驗證 Email、登入、重設密碼，登入後以身分切換器進入各身分的首頁；社團能申請成為主辦方並由平台管理員審核；所有人能在通知中心收到站內通知與 Email。\n\n| User Story | 內容 |\n| --- | --- |\n| 1.1 以官方範本建立可一鍵啟動的專案骨架 | As a 開發組員\u003cbr>I want to 以官方全端範本建立符合架構設計的專案骨架\u003cbr>So that 所有人從同一個可執行、可測試的基礎開始開發 |\n| 1.2 FLOW 前端外框與主題 | As a 使用平台的任何人\u003cbr>I want to 有一致的外觀、頂欄與深淺色切換\u003cbr>So that 不論在桌機或手機，都用同一套熟悉的介面操作 |\n| 1.3 以 Email 註冊並完成驗證 | As a 訪客\u003cbr>I want to 用 Email 與密碼註冊，並透過驗證信完成驗證\u003cbr>So that 我能擁有帳號參與平台 |\n| 1.4 登入、登出、帳號資料與身分切換器 | As a 已註冊的使用者\u003cbr>I want to 登入後用身分切換器進入我的各個身分，並管理自己的帳號資料\u003cbr>So that 我能以自己的身分使用平台 |\n| 1.5 忘記與重設密碼 | As a 忘記密碼的使用者\u003cbr>I want to 透過 Email 中的連結重設密碼\u003cbr>So that 我不必重新註冊就能回到原帳號 |\n| 1.6 通知中心 | As a 已登入的使用者\u003cbr>I want to 在頂欄看到未讀數，並在通知中心查看與我有關的通知\u003cbr>So that 我不會錯過與我有關的事 |\n| 1.7 申請成為主辦方 | As a 已驗證的帳號\u003cbr>I want to 填寫社團名稱與學校，送出主辦方申請\u003cbr>So that 我能取得建立賽事的資格 |\n| 1.8 平台管理員審核主辦方申請 | As a 平台管理員\u003cbr>I want to 檢視待審核的申請並核准或退回\u003cbr>So that 只有真實存在的社團能成為主辦方 |\n\n### （二）Epic 2：遊戲設定與賽事建立\n\n平台管理員維護遊戲與學校清單；主辦方建立、修改、取消賽事並邀請裁判；觀眾能瀏覽賽事列表與賽事頁；主辦方能查閱自己賽事的操作紀錄。\n\n| User Story | 內容 |\n| --- | --- |\n| 2.1 平台管理員維護遊戲設定與學校清單 | As a 平台管理員\u003cbr>I want to 新增與修改遊戲的人數、BO、每局預估時間、段位對照表與比分型態，並維護學校清單\u003cbr>So that 主辦方能用任何兩隊對打的遊戲辦賽事而不需改程式，學校名稱也不會因各自輸入而不一致 |\n| 2.2 主辦方建立賽事 | As a 主辦方\u003cbr>I want to 選擇遊戲並填寫賽事資訊來建立賽事\u003cbr>So that 隊伍能開始報名 |\n| 2.3 分輪設定 BO 數 | As a 主辦方\u003cbr>I want to 為不同輪次設定不同的 BO 數\u003cbr>So that 前幾輪快速、四強與決賽更慎重 |\n| 2.4 公開賽事列表與賽事頁 | As a 觀眾\u003cbr>I want to 不登入就能瀏覽賽事列表與賽事頁\u003cbr>So that 我知道有哪些賽事、何時開打、哪裡看直播 |\n| 2.5 抽籤前修改賽事 | As a 主辦方\u003cbr>I want to 在抽籤前延長報名、提高名額、放寬時限，並隨時更新直播連結\u003cbr>So that 報名狀況不如預期時能調整 |\n| 2.6 取消賽事 | As a 主辦方\u003cbr>I want to 取消尚未結束的賽事\u003cbr>So that 賽事辦不成時能正式停止 |\n| 2.7 邀請裁判 | As a 主辦方\u003cbr>I want to 產生裁判邀請連結，讓受邀者接受後成為該賽事的裁判\u003cbr>So that 我有人手負責登錄比分 |\n| 2.8 主辦方查閱操作紀錄 | As a 主辦方\u003cbr>I want to 查閱我的賽事的所有操作紀錄\u003cbr>So that 發生爭議時能拿出證據 |\n\n### （三）Epic 3：組隊報名與名額分配\n\n隊長組隊並送出報名，名單鎖定前可移除隊員或轉讓隊長；系統依賽事模式（校園賽三階段、自訂先到先得）自動分配正取與候補，且不超收；主辦方能檢視段位截圖與退回報名。\n\n| User Story | 內容 |\n| --- | --- |\n| 3.1 建立隊伍與邀請隊員 | As a 隊長\u003cbr>I want to 為一個賽事建立隊伍並取得邀請連結\u003cbr>So that 隊友能加入我的隊伍 |\n| 3.2 選手填寫參賽資料 | As a 選手\u003cbr>I want to 填寫遊戲 ID、段位並上傳段位截圖\u003cbr>So that 我的隊伍能符合報名條件 |\n| 3.3 送出報名與鎖定名單 | As a 隊長\u003cbr>I want to 在報名期間送出報名並鎖定名單\u003cbr>So that 我的隊伍正式參加名額分配 |\n| 3.4 優先期結束自動分配 | As a 主辦方\u003cbr>I want to 優先期結束時由系統自動選出各校代表隊並分配正取\u003cbr>So that 我不必手動計算誰是學校代表隊 |\n| 3.5 先搶期即時分配 | As a 隊長\u003cbr>I want to 在先搶期送出報名時立刻知道是正取或候補\u003cbr>So that 我能及早準備或另做安排 |\n| 3.6 報名截止與截止補位 | As a 主辦方\u003cbr>I want to 報名截止時由系統自動以候補依平均段位積分補上剩餘名額\u003cbr>So that 名額不會浪費 |\n| 3.7 抽籤前撤回報名 | As a 隊長\u003cbr>I want to 在抽籤前撤回報名，並在候補時看懂自己的順位\u003cbr>So that 隊伍無法參賽時能讓出名額，候補隊伍也知道何時可能遞補 |\n| 3.8 主辦方檢視段位截圖與退回報名 | As a 主辦方\u003cbr>I want to 在報名清單檢視段位截圖，並附原因退回不合格的報名\u003cbr>So that 段位造假的隊伍不會拿到名額 |\n| 3.9 公開正取名單與取消賽事通知 | As a 觀眾與參賽隊伍\u003cbr>I want to 在賽事頁看到正取隊伍，並在賽事取消時收到通知\u003cbr>So that 大家都清楚誰參賽、賽事是否照常舉行 |\n| 3.10 自訂模式的先到先得分配 | As a 校內賽的主辦方\u003cbr>I want to 賽事模式設為「自訂」時，系統不限學校、依送出先後分配正取\u003cbr>So that 同校隊伍互打的賽事也能用平台辦理 |\n| 3.11 隊員異動與解散隊伍 | As a 隊長與隊員\u003cbr>I want to 在名單鎖定前移除隊員、轉讓隊長或解散隊伍，隊員也能自行退出\u003cbr>So that 隊員異動、我無法帶隊或加錯隊伍時，大家仍能完成報名 |\n\n### （四）Epic 4：抽籤與對戰表\n\n報名截止時自動抽籤（或由主辦方提前抽籤），產生含輪空與季軍賽的單淘汰對戰表並排定時間；主辦方指派裁判；抽籤後退賽由候補遞補；觀眾在手機上看到自動更新的視覺化對戰樹，並能搜尋隊伍看到晉級路徑。\n\n| User Story | 內容 |\n| --- | --- |\n| 4.1 主辦方提前抽籤並產生對戰表 | As a 主辦方\u003cbr>I want to 在報名截止前按下「抽籤」立即產生單淘汰對戰表\u003cbr>So that 報名人數足夠時能提早公布賽程 |\n| 4.2 報名截止時自動抽籤 | As a 主辦方\u003cbr>I want to 報名截止時由系統自動完成補位與抽籤\u003cbr>So that 我不必在截止那一刻守在電腦前 |\n| 4.3 排定與修改場次時間 | As a 主辦方\u003cbr>I want to 系統依開賽日期與每輪間隔自動排定場次時間，並讓我個別調整\u003cbr>So that 賽程公布時就有時間表 |\n| 4.4 指派裁判到場次 | As a 主辦方\u003cbr>I want to 把賽事的裁判指派到場次\u003cbr>So that 每個場次都有人負責登錄比分 |\n| 4.5 抽籤後退賽與候補遞補 | As a 隊長\u003cbr>I want to 在隊伍第一個場次開打前退賽\u003cbr>So that 無法出賽時能讓候補隊伍頂上 |\n| 4.6 視覺化對戰樹 | As a 觀眾\u003cbr>I want to 在手機與桌機上看到視覺化對戰樹\u003cbr>So that 我隨時知道賽事進行到哪裡 |\n| 4.7 對戰樹隊伍搜尋與晉級路徑 | As a 觀眾\u003cbr>I want to 輸入隊名就在對戰樹上看到該隊的晉級路徑\u003cbr>So that 我在手機上也能馬上找到我關心的隊伍 |\n\n### （五）Epic 5：場次進行與晉級\n\n隊長報到、系統逾時判棄權（含雙方棄權）；裁判在場次頁逐局登錄比分並送出系列結果；申訴期滿自動確認並晉級，直到產生冠軍、亞軍與季軍。\n\n| User Story | 內容 |\n| --- | --- |\n| 5.1 場次頁與隊長報到 | As a 隊長\u003cbr>I want to 在場次頁看到場次資訊，並在開賽前 30 分鐘起為自己的隊伍報到\u003cbr>So that 裁判知道我們準備好了 |\n| 5.2 逾時判棄權 | As a 主辦方\u003cbr>I want to 過了棄權期限仍未報到的隊伍由系統自動判棄權\u003cbr>So that 賽程不會因缺席而卡住 |\n| 5.3 裁判逐局登錄比分 | As a 裁判\u003cbr>I want to 在場次頁每打完一局就登錄結果\u003cbr>So that 比分即時留下紀錄，不必另外抄寫 |\n| 5.4 送出系列結果 | As a 裁判\u003cbr>I want to 系統依各局結果算出系列比分，由我核對後送出並鎖定\u003cbr>So that 結果正確且不能隨意更改 |\n| 5.5 申訴期滿自動確認與一般晉級 | As a 隊長與觀眾\u003cbr>I want to 申訴期滿後結果自動確認，勝隊自動晉級\u003cbr>So that 賽程不需人工推進 |\n| 5.6 季軍賽、雙方棄權與賽事結束 | As a 主辦方\u003cbr>I want to 季軍賽、雙方棄權與冠軍產生都由系統自動處理\u003cbr>So that 賽事能自動走到終點並產生名次 |\n| 5.7 勝隊上傳結算截圖 | As a 勝隊隊長\u003cbr>I want to 上傳遊戲結算畫面作為佐證\u003cbr>So that 結果有圖可查 |\n| 5.8 場次頁與對戰樹結果標示 | As a 觀眾\u003cbr>I want to 在場次頁看到每局比分與目前狀態，並在對戰樹上看到勝負\u003cbr>So that 我能掌握每一場的細節 |\n\n### （六）Epic 6：申訴、檢舉與取消資格\n\n隊長能對場次結果申訴、對他隊資格檢舉；主辦方處理申訴與取消資格，對戰表依規則頂替。\n\n| User Story | 內容 |\n| --- | --- |\n| 6.1 提出申訴 | As a 隊長\u003cbr>I want to 在申訴期內對場次結果（含棄權判定）提出申訴\u003cbr>So that 比分有誤時能經正式管道更正 |\n| 6.2 主辦方處理申訴 | As a 主辦方\u003cbr>I want to 附理由維持或更正申訴的結果，棄權判定錯誤時安排重新比賽\u003cbr>So that 爭議有明確結論 |\n| 6.3 申訴逾期提醒與受影響場次暫停 | As a 主辦方\u003cbr>I want to 申訴快逾期時收到一次提醒，且申訴未處理前，等待這個結果的下一場不會開始報到與棄權計時\u003cbr>So that 不會有隊伍因為我還沒處理申訴而被誤判棄權 |\n| 6.4 提出檢舉 | As a 隊長\u003cbr>I want to 檢舉同一賽事中我懷疑資格不符的隊伍\u003cbr>So that 違規隊伍能被查證 |\n| 6.5 查證檢舉與取消資格 | As a 主辦方\u003cbr>I want to 駁回檢舉，或取消違規隊伍的資格並讓對戰表自動頂替\u003cbr>So that 違規隊伍不會繼續晉級，賽程也不必重排 |\n\n### （七）Epic 7：示範資料與整體驗收\n\n一鍵啟動即載入 2 款遊戲、學校清單與 32 隊示範賽事；完成兩款遊戲在桌機與 375 px 手機上的端對端完整演練，並彙整各層測試的結果與覆蓋率。本 Epic 對應期末的《測試計畫》與《專案測試報告》。\n\n| User Story | 內容 |\n| --- | --- |\n| 7.1 一鍵載入示範資料 | As a Demo 評審\u003cbr>I want to 執行 docker compose up 後就有完整的示範資料\u003cbr>So that 不必手動建資料就能看到完整流程 |\n| 7.2 端對端演練：兩款遊戲的完整賽事 | As a 教授與評審\u003cbr>I want to 用自動化腳本跑完兩款遊戲從報名到頒獎的完整流程\u003cbr>So that 證明系統不需外部試算表就能辦完一場賽事 |\n| 7.3 測試覆蓋率與測試報告素材 | As a 測試負責人\u003cbr>I want to 一個指令就產出三層測試的結果與覆蓋率\u003cbr>So that 能直接放進測試計畫與測試報告 |\n\n## 二、功能清單\n\n功能清單依系統功能（而非開發順序）分為 7 個功能群，每項功能對應功能需求編號（FR，完整敘述與可測結果見附錄）與實作它的 User Story。\n\n| 功能群編號 | 功能群名稱 | 功能編號 | 功能名稱 | 對應 FR | 對應 Story |\n| --- | --- | --- | --- | --- | --- |\n| 1.0 | 帳號與身分 | 1.1 | 註冊、Email 驗證與登入 | FR-1 | 1.3、1.4 |\n|  |  | 1.2 | 忘記與重設密碼 | FR-40 | 1.5 |\n|  |  | 1.3 | 主辦方申請 | FR-2 | 1.7 |\n|  |  | 1.4 | 審核主辦方申請 | FR-3 | 1.8 |\n|  |  | 1.5 | 邀請與指派裁判 | FR-4 | 2.7、4.4 |\n|  |  | 1.6 | 依身分控管權限 | FR-5 | 1.1、1.4 及各 Story |\n| 2.0 | 賽事建立與遊戲設定 | 2.1 | 維護遊戲設定與學校清單 | FR-6 | 2.1 |\n|  |  | 2.2 | 建立賽事 | FR-7 | 2.2 |\n|  |  | 2.3 | 賽事模式與報名連結 | FR-39 | 2.2、3.1、3.10 |\n|  |  | 2.4 | 分輪設定 BO 數 | FR-8 | 2.3 |\n|  |  | 2.5 | 修改賽事 | FR-9 | 2.5、4.3 |\n|  |  | 2.6 | 取消賽事 | FR-10 | 2.6、3.9 |\n|  |  | 2.7 | 查閱操作紀錄 | NFR-3 | 2.8 |\n| 3.0 | 隊伍與報名 | 3.1 | 建立隊伍與邀請隊員 | FR-11 | 3.1 |\n|  |  | 3.2 | 隊員異動與解散隊伍 | FR-41 | 3.11 |\n|  |  | 3.3 | 填寫選手參賽資料 | FR-12 | 3.2 |\n|  |  | 3.4 | 送出報名與鎖定名單 | FR-13 | 3.3 |\n|  |  | 3.5 | 優先期名額分配 | FR-14 | 3.4 |\n|  |  | 3.6 | 先搶期即時分配 | FR-15 | 3.5 |\n|  |  | 3.7 | 截止補位 | FR-16 | 3.6 |\n|  |  | 3.8 | 退賽與候補遞補 | FR-17 | 3.7、4.5 |\n|  |  | 3.9 | 檢視段位截圖與退回報名 | FR-18 | 3.8 |\n| 4.0 | 抽籤與對戰表 | 4.1 | 抽籤 | FR-19 | 4.1、4.2 |\n|  |  | 4.2 | 產生單淘汰對戰表 | FR-20 | 4.1 |\n|  |  | 4.3 | 晉級推進 | FR-21 | 4.1、5.5、5.6 |\n|  |  | 4.4 | 取消資格後的頂替 | FR-22 | 6.5 |\n|  |  | 4.5 | 排定場次時間 | FR-23 | 4.3 |\n| 5.0 | 場次進行 | 5.1 | 報到 | FR-24 | 5.1 |\n|  |  | 5.2 | 逾時判棄權 | FR-25 | 5.2、6.3 |\n|  |  | 5.3 | 登錄每局比分 | FR-26 | 5.3 |\n|  |  | 5.4 | 送出系列結果 | FR-27 | 5.4 |\n|  |  | 5.5 | 上傳結算截圖 | FR-28 | 5.7 |\n|  |  | 5.6 | 申訴期滿自動確認 | FR-29 | 5.5 |\n| 6.0 | 申訴與檢舉 | 6.1 | 提出申訴 | FR-30 | 6.1 |\n|  |  | 6.2 | 處理申訴 | FR-31 | 6.2、6.3 |\n|  |  | 6.3 | 提出檢舉 | FR-32 | 6.4 |\n|  |  | 6.4 | 查證檢舉與取消資格 | FR-33 | 6.5 |\n| 7.0 | 觀賽與通知 | 7.1 | 公開賽事頁 | FR-34 | 2.4、3.9 |\n|  |  | 7.2 | 視覺化對戰樹 | FR-35 | 4.6、4.7、5.8 |\n|  |  | 7.3 | 場次頁 | FR-36 | 5.1、5.8 |\n|  |  | 7.4 | 事件通知（站內與 Email） | FR-37 | 1.3、1.6 及各 Epic |\n|  |  | 7.5 | 站內通知中心 | FR-38 | 1.6 |\n\n功能群是從使用者角度劃分的需求分組；《軟體設計文件》的後端則依資料擁有權切成 6 個程式模組。兩者大致一對一，但有幾項功能橫跨模組，對照如下：\n\n| 功能群 | 主要後端模組 | 橫跨其他模組的功能 |\n| --- | --- | --- |\n| 1.0 帳號與身分 | identity | 1.5 的裁判邀請屬 tournaments、指派裁判屬 competition；1.6 的資源層級權限由各模組的 Service 呼叫 core.authz 檢查 |\n| 2.0 賽事建立與遊戲設定 | tournaments | 2.1 的學校清單屬 identity；2.5 的提高名額會讓候補遞補，由 registration 主導；2.7 的操作紀錄存在 core 的 AuditLog，由 tournaments 確認主辦方身分後查詢 |\n| 3.0 隊伍與報名 | registration | 3.8 抽籤後的退賽與遞補由 competition 主導 |\n| 4.0 抽籤與對戰表 | competition | — |\n| 5.0 場次進行 | competition | — |\n| 6.0 申訴與檢舉 | disputes | 6.2 的更正結果與 6.4 的取消資格頂替，由 disputes 呼叫 competition 執行 |\n| 7.0 觀賽與通知 | notifications | 7.1～7.3 的公開頁向各擁有模組的 Service 取資料，不另設模組；notifications 負責 7.4、7.5 |\n\n## 三、功能清單說明\n\n### （一）1.0 功能群：帳號與身分\n\n帳號與身分功能群是整個系統的入口。任何人都能以 Email 註冊帳號，完成 Email 驗證後才能報名或申請成為主辦方。想辦賽事的人送出主辦方申請，由平台管理員審核；主辦方再針對自己的賽事邀請裁判。系統依帳號在每個賽事、每支隊伍中的身分決定可執行的操作，所有權限都在伺服器端檢查。\n\n- 1.1 註冊、Email 驗證與登入：以 Email 與密碼註冊，學校為選填、從學校清單選擇；驗證連結 24 小時內有效，可重寄，重寄後舊連結失效；密碼以雜湊保存。\n- 1.2 忘記與重設密碼：重設連結 1 小時內有效、只能使用一次；不論 Email 是否註冊，畫面都顯示相同訊息。\n- 1.3 主辦方申請：填寫社團名稱並從學校清單選擇學校；同一帳號同時只能有一筆待審核的申請。\n- 1.4 審核主辦方申請：平台管理員核准或附原因退回；退回後可修改重送，不限次數。\n- 1.5 邀請與指派裁判：主辦方產生 7 天內有效的邀請連結；受邀者接受後成為該賽事裁判，再由主辦方指派到場次。一位裁判可以被指派到多個場次（含同一時段）；不能指派到自己隊伍參賽的場次，隊伍晉級後才出現這種情況時，系統取消該場的指派並通知主辦方改派。送出系列結果前，主辦方也可以隨時改派或收回指派。\n- 1.6 依身分控管權限：非隊長不能修改隊伍、非主辦方不能處理爭議、觀眾不能執行任何寫入操作；主辦方不能在自己主辦的賽事建立或加入隊伍。\n\n### （二）2.0 功能群：賽事建立與遊戲設定\n\n各遊戲的差異做成設定，而不是寫死在程式裡。平台管理員維護遊戲清單與預設值；主辦方建立賽事時選擇遊戲，系統自動帶入預設值並把設定複製一份到賽事上，之後修改遊戲預設值不會影響已建立的賽事。賽事依「尚未開放 → 開放報名 → 報名截止 → 賽程已公布 → 進行中 → 已結束」推進，也可被主辦方取消。\n\n- 2.1 維護遊戲設定與學校清單：先發人數、替補人數、預設 BO 數（限 1、3、5、7）、每局預估時間、段位積分對照表與比分型態（只記勝負，或記回合比分）。學校清單以教育部大專校院名錄為初始資料，平台管理員可新增或修正；帳號、主辦方申請與報名的學校一律從清單選擇，避免「台大」與「國立臺灣大學」被當成兩間學校。\n- 2.2 建立賽事：名額、報名開始與截止時間、優先期、開賽日期、每輪間隔、棄權時限（至少 15 分鐘）、申訴期（至少 30 分鐘）與選填的直播連結。每輪間隔不得小於「棄權時限＋預設 BO 數 × 每局預估時間＋申訴期」，確保上一輪最晚開打、打滿 BO 並走完申訴期後，下一輪才開始。報名開始時間未到時賽事為「尚未開放」，到時由系統自動開放報名。\n- 2.3 賽事模式與報名連結：校園賽要求同隊同校並依三階段分配；自訂賽事由主辦方發出報名連結，持有效連結才能建立隊伍；主辦方可重設報名連結，舊連結立即失效。\n- 2.4 分輪設定 BO 數：例如前幾輪 BO1、四強 BO3、決賽 BO5；BO 數限 1、3、5、7，勝局門檻為（BO＋1）÷ 2；未設定時使用遊戲預設值。\n- 2.5 修改賽事：尚未開放時可修改所有設定；開放報名後到抽籤前只能放寬（延長報名、提高名額、延長棄權時限、申訴期與每輪間隔）或修改分輪 BO，提高名額時候補立即依當下階段的遞補規則遞補；抽籤後只能修改場次時間；直播連結在賽事結束前都能修改。\n- 2.6 取消賽事：尚未結束的賽事可取消，所有已報名隊伍收到通知。\n- 2.7 查閱操作紀錄：主辦方可依賽事查閱自己賽事的所有操作紀錄；每筆操作紀錄都記下所屬賽事（帳號類的操作不屬於任何賽事）。\n\n### （三）3.0 功能群：隊伍與報名\n\n隊長為每個賽事建立隊伍，以邀請連結找齊隊員；每位選手提供遊戲 ID、段位與段位截圖。名單湊齊後送出報名並鎖定。校園賽的名額依三個階段分配，兼顧段位高的隊伍與先到的隊伍；自訂賽事改為先到先得。這是本系統最核心、也最容易出錯的規則，所有會改變正取、候補或名單的操作都必須依序處理，確保不超收、不超過人數上限。凡是依平均段位積分排序的規則，同分時依序比較送出時間（較早者優先）與報名 id，確保每次計算結果一致。\n\n- 3.1 建立隊伍與邀請隊員：隊伍只屬於一個賽事；同一帳號在同一賽事只能加入一支隊伍；主辦方不能在自己主辦的賽事建立或加入隊伍；人數達上限後邀請連結失效，多人同時加入時依序處理，不會超過上限。\n- 3.2 隊員異動與解散隊伍：只能在名單鎖定前操作；隊長可以移除隊員、轉讓隊長或解散隊伍，隊員可以自行退出；隊長不能移除自己，要退出須先轉讓。\n- 3.3 填寫選手參賽資料：段位須在該遊戲的對照表內；段位截圖限 5 MB 以內的 JPG 或 PNG。平均段位積分計入名單上所有成員（含替補），系統不區分先發與替補，上場人員由隊伍自行決定。名單鎖定期間不能修改參賽資料。\n- 3.4 送出報名與鎖定名單：人數不足、資料未填完或（校園賽）有隊員未設定學校、隊員不同校時無法送出。\n- 3.5 優先期名額分配：優先期結束時，各校取平均段位積分最高的一隊為代表隊；代表隊超過名額時再依平均段位積分取前 N 隊。\n- 3.6 先搶期即時分配：優先期沒有報名、且目前沒有正取的學校，第一支送出的隊伍立即成為正取，額滿後列候補；同校之後在先搶期送出的隊伍列候補，報名截止時可參加截止補位。\n- 3.7 截止補位：截止時名額仍有剩，由所有候補依平均段位積分補位，每校最多 2 隊；順序與報名截止後的遞補相同。\n- 3.8 退賽與候補遞補：第一場開打前可退賽，由候補依當下階段的規則遞補；候補隊伍可看到自己的候補順位。\n- 3.9 檢視段位截圖與退回報名：主辦方附原因退回，名單解鎖，隊伍可在報名期間內修正重送；重送時重新寫入快照（含送出時間）。\n\n### （四）4.0 功能群：抽籤與對戰表\n\n報名截止時系統自動抽籤，主辦方也可以提前抽籤。系統隨機排定單淘汰對戰表；隊伍數不是 2 的次方時，第一輪安排輪空。場次變為已確認後，勝隊自動進入下一輪，四強的兩支敗隊另打季軍賽。\n\n- 4.1 抽籤：只能執行一次；提前抽籤會立即結束報名，仍在優先期內時先完成優先期分配，再執行截止補位；正取少於 2 隊時無法抽籤。\n- 4.2 產生單淘汰對戰表：設 P 為不小於正取隊數的最小 2 的次方，輪數為 log₂P，第一輪輪空數為 P 減正取隊數，輪空位置平均分散；正取少於 4 隊時不產生季軍賽。\n- 4.3 晉級推進：勝隊自動填入下一輪，準決賽的敗隊填入季軍賽。某一方位置確定不會有隊伍時（前一場雙方棄權，或退賽、取消資格後無人遞補），另一方輪空晉級；準決賽沒有產生勝隊時，另一場準決賽的勝隊直接成為冠軍、季軍賽取消，另一場準決賽的敗隊列為亞軍、季軍從缺。下一輪對位確定後通知兩隊；決賽與季軍賽都定案後賽事結束。\n- 4.4 取消資格後的頂替：尚未比賽的隊伍由候補遞補，沒有候補則對手輪空；已贏過比賽的隊伍由最近一場輸給它的隊伍頂替（被取消資格的是決賽隊伍時，由準決賽敗隊頂替進入決賽，它原本的季軍賽由對手輪空；季軍賽已開打則不頂替，決賽由對手輪空；等待季軍賽的隊伍被取消資格時，季軍賽由對手輪空）；進行中、申訴期或申訴中的場次直接判對手獲勝；已被淘汰的隊伍只標示取消資格，已確認的結果不變。\n- 4.5 排定場次時間：依開賽日期與每輪間隔自動排定，同一輪排在同一時段；某一輪的 BO 數較大，使「棄權時限＋該輪 BO 數 × 每局預估時間＋申訴期」超過每輪間隔時，下一輪自動順延。系統不自動分批，裁判人手不足時，主辦方可個別修改場次時間，或讓同一位裁判負責多個場次；場次已有隊伍報到後不能修改時間，新時間也不得晚於勝隊要去的下一場。\n\n### （五）5.0 功能群：場次進行\n\n場次兩隊都確定後，從開賽前 30 分鐘開放報到；過了棄權期限仍未報到的隊伍由系統判棄權。裁判每打完一局登錄比分，有一隊達到勝局門檻時系統算出系列結果，裁判送出後進入申訴期；申訴期滿無申訴則自動確認並晉級。\n\n- 5.1 報到：場次兩隊都確定後才開放；只有該場兩隊的隊長能報到；兩隊都報到後，裁判看到「可開始」。\n- 5.2 逾時判棄權：棄權期限為「預定開始時間」與「兩隊都確定的時間」較晚者，加上棄權時限；一隊未報到判該隊棄權，兩隊都未報到則兩隊皆判棄權。隊伍還沒確定的場次（例如前一場仍在申訴中）不開放報到、不起算棄權期限；暫停只影響等待該結果的場次，同一輪的其他場次照常進行，申訴處理完成後從處理完成時間重新起算。\n- 5.3 登錄每局比分：兩隊都報到後，只有被指派的裁判能登錄（未指派時主辦方可代登）；回合比分不能平手；達到勝局門檻後不能再新增局數。\n- 5.4 送出系列結果：有一隊達到勝局門檻才能送出；送出前可修改任一局；送出後鎖定並進入申訴期，更正只能經由申訴。\n- 5.5 上傳結算截圖：只有勝隊隊長能上傳；沒有上傳不影響結果確認。\n- 5.6 申訴期滿自動確認：申訴期滿前勝隊不會出現在下一輪；期滿且無申訴時，場次變為已確認並晉級。\n\n### （六）6.0 功能群：申訴與檢舉\n\n申訴針對單一場次的結果（含棄權判定），在申訴期內由任一隊隊長提出，主辦方須在等待這個結果的下一場開始前處理。檢舉針對另一支隊伍的參賽資格，賽事結束前都能提出；主辦方查證屬實就取消該隊資格，對戰表依頂替規則調整。所有處理結果都附理由並通知相關隊伍。\n\n- 6.1 提出申訴：每支隊伍對同一場次只能申訴一次；第一筆申訴提出後場次狀態變為「申訴中」，另一隊在申訴期限內仍可提出，主辦方一次處理同一場次的所有申訴。\n- 6.2 處理申訴：主辦方維持或更正結果並附理由，棄權判定錯誤時可安排重新比賽；下一場預定開始前 1 小時（決賽與季軍賽為提出後 1 小時）仍未處理時，系統提醒主辦方，每筆申訴只提醒一次。\n- 6.3 提出檢舉：提出檢舉與被檢舉的隊伍都須已送出報名（待分配、正取、候補或已參賽），不能檢舉自己的隊伍；被檢舉的隊伍在查證前不受影響。\n- 6.4 查證檢舉與取消資格：駁回或取消資格並附理由；賽事結束後只能駁回或記錄屬實，不改動名次。\n\n### （七）7.0 功能群：觀賽與通知\n\n任何人不登入就能瀏覽賽事列表、視覺化對戰樹與場次結果，手機上也能順暢閱讀。賽事中的重要事件以站內通知與 Email 同時通知相關的人，每個事件只通知一次。\n\n- 7.1 公開賽事頁：顯示賽事資訊、報名狀態（尚未開放的賽事顯示報名開始時間）與正取隊伍，不顯示 Email 等個人資料。\n- 7.2 視覺化對戰樹：已確認的場次標示勝隊與比分，淘汰的隊伍以灰色顯示，輪空、棄權、取消資格以不同標示呈現；場次變為已確認後 10 秒內更新；375 px 手機可左右捲動閱讀。\n- 7.3 場次頁：顯示每一局的結果與場次狀態；結算截圖公開，段位截圖只有主辦方看得到。\n- 7.4 事件通知：主辦方申請送出與結果、報名結果、抽籤完成或正取不足無法抽籤、場次時間變更、下一場對手、判棄權、申訴與檢舉、申訴即將逾期、裁判被指派或取消指派、隊伍解散、賽事取消等事件；Email 寄送失敗會記錄並重試，不影響主流程。\n- 7.5 站內通知中心：新通知顯示在最上方並增加未讀數；點開通知導向相關頁面。\n\n## 四、非功能需求\n\n| 編號 | 類別 | 需求 | 驗證方式 |\n| --- | --- | --- | --- |\n| NFR-1 | 併發一致性 | 多支隊伍同時送出報名時，正取隊數不超過名額，不產生重複的正取或遺失的報名；同一場次的比分不會因同時操作而互相覆蓋 | 以真 PostgreSQL 執行的併發整合測試（平行送出 200 筆報名、同時登錄同一場次） |\n| NFR-2 | 效能 | 一般操作（瀏覽賽事與對戰樹、送出報名、登錄比分）的 API 在 1 秒內回應；場次變為「已確認」後，公開對戰樹在 10 秒內顯示新結果 | 在 docker compose 示範環境中，以整合測試與 Playwright 端對端測試記錄回應時間與對戰樹更新時間 |\n| NFR-3 | 操作紀錄 | 報名、名額分配、抽籤、比分、申訴、檢舉、取消資格與時間修改都記錄操作者、時間、所屬賽事與變更前後內容；紀錄不可修改或刪除 | 整合測試逐項檢查紀錄；資料庫 trigger 拒絕修改與刪除 |\n| NFR-4 | 定時規則 | 報名開始、優先期結束、報名截止、賽事開始、棄權判定、申訴期滿與申訴逾期提醒，在預定時間後 1 分鐘內自動執行 | 以可替換時鐘推進時間的整合測試 |\n| NFR-5 | 權限 | 所有權限在伺服器端驗證，繞過介面直接呼叫也會被拒絕 | 直接呼叫 API 的權限測試 |\n| NFR-6 | 個資保護 | 密碼雜湊保存；Email、學校與段位截圖不出現在公開頁面 | 檢查公開 API 回應內容 |\n| NFR-7 | 手機可用 | 所有頁面在 375 px 寬的手機上可操作；介面為繁體中文 | Playwright 以 375 px 視窗執行端對端測試 |\n| NFR-8 | 可部署 | 以 docker compose 一個指令啟動全部服務，並提供示範資料 | 在乾淨環境執行一鍵啟動 |\n| NFR-9 | 可擴充 | 新增遊戲只需在後台設定，不需修改程式 | 於後台新增一款遊戲並建立賽事 |\n\n# 參、系統分析\n\n## 一、使用案例圖\n\n本節依功能群繪製使用案例圖。圖中人形為參與者（actor），方框為系統邊界，橢圓為使用案例；實線表示參與者使用該案例，虛線箭頭標示 «include»（必定包含）與 «extend»（選擇性延伸）。「時間」代表由背景工作程序（worker）在期限到達時自動觸發的使用案例。少數使用案例屬於其他功能群，因為與本功能群的流程直接相關而一併畫出，名稱後以括號標示其功能編號。\n\n### （一）1.0 功能群：帳號與身分\n\n本功能群涵蓋帳號的建立、驗證、登入與主辦方權限的申請審核。訪客註冊並驗證 Email 後成為帳號；帳號可申請成為主辦方，由平台管理員審核；主辦方再邀請帳號擔任自己賽事的裁判。\n\n![使用案例圖：1.0 帳號與身分](figures/B-usecase-1.png)\n\n### （二）2.0 功能群：賽事建立與遊戲設定\n\n平台管理員維護遊戲清單、預設值與學校清單；主辦方建立賽事時自動帶入所選遊戲的預設值，並可分輪設定 BO 數、抽籤前修改賽事、取消賽事、查閱操作紀錄，以及重設自訂賽事的報名連結。觀眾可瀏覽公開的賽事資訊。\n\n![使用案例圖：2.0 賽事建立與遊戲設定](figures/B-usecase-2.png)\n\n### （三）3.0 功能群：隊伍與報名\n\n隊長建立隊伍並邀請隊員，選手填寫參賽資料後由隊長送出報名。送出報名必定包含名額判定；校園賽的優先期結算與截止補位由時間觸發。主辦方可檢視段位截圖並退回報名。\n\n![使用案例圖：3.0 隊伍與報名](figures/B-usecase-3.png)\n\n### （四）4.0 功能群：抽籤與對戰表\n\n抽籤可由時間（報名截止）或主辦方（提前抽籤）觸發，並包含產生對戰表與排定場次時間。抽籤後主辦方可修改場次時間、指派裁判；隊長在第一場開打前退賽時，由候補遞補。\n\n![使用案例圖：4.0 抽籤與對戰表](figures/B-usecase-4.png)\n\n### （五）5.0 功能群：場次進行\n\n隊長在開賽前報到，裁判逐局登錄比分並送出系列結果，勝隊隊長上傳結算截圖。逾時判棄權與申訴期滿自動確認由時間觸發，確認後必定進行晉級推進。\n\n![使用案例圖：5.0 場次進行](figures/B-usecase-5.png)\n\n### （六）6.0 功能群：申訴與檢舉\n\n隊長在申訴期內對場次結果申訴，或在賽事結束前對他隊資格檢舉；主辦方處理申訴（維持或更正）與查證檢舉（駁回或取消資格）。取消資格包含對戰表頂替；申訴快逾期時，系統提醒主辦方。\n\n![使用案例圖：6.0 申訴與檢舉](figures/B-usecase-6.png)\n\n### （七）7.0 功能群：觀賽與通知\n\n觀眾不登入就能瀏覽賽事、對戰樹與場次；登入的帳號可在通知中心查看通知。賽事中發生重要事件時，系統以站內通知與 Email 通知相關的人。\n\n![使用案例圖：7.0 觀賽與通知](figures/B-usecase-7.png)\n\n## 二、核心 Use Case 規格說明\n\n本節挑選影響核心流程、也最能體現系統規則的三個使用案例，說明其操作流程、例外狀況與系統回應，作為設計、實作與測試的依據。\n\n### （一）隊長送出報名\n\n| 項目 | 說明 |\n| --- | --- |\n| Use Case 名稱 | 隊長送出報名 |\n| 主要角色 | 隊長 |\n| 次要角色 | 系統 |\n| 關聯功能群 | 隊伍與報名、賽事建立與遊戲設定 |\n| 對應需求 | FR-13、FR-14、FR-15、FR-39、NFR-1 |\n| 優先順序 | 高 |\n\n- **前置條件**\n  1. 隊長已登入，且 Email 已驗證。\n  2. 賽事狀態為「開放報名」，且目前在報名期間內。\n  3. 隊伍名單人數達到先發人數，所有隊員都已填完遊戲 ID、段位與段位截圖。\n- **觸發事件**：隊長在隊伍頁按下「送出報名」。\n- **主要流程**\n  1. 系統提示「送出後名單將鎖定」，隊長確認送出。\n  2. 系統鎖住該賽事的資料列，使同時送出的報名依序處理。\n  3. 系統確認送出者是隊長、名單完整，且（校園賽）所有隊員同校。\n  4. 系統寫入學校、平均段位積分與送出時間的快照，並鎖定名單。\n  5. 系統依目前階段判定結果：優先期內為「已送出・待分配」；先搶期內立即判定正取或候補。\n  6. 系統寫入操作紀錄並發出報名結果通知。\n  7. 畫面顯示結果；候補時顯示「候補第 N 位」。\n- **例外流程**\n  - 2a. 不在報名期間：系統拒絕並顯示原因，流程結束。\n  - 3a. 名單不完整，或（校園賽）有隊員未設定學校、隊員學校不一致：系統拒絕並逐項列出缺少的條件，名單不鎖定。\n  - 5a. 先搶期名額已滿、同校在優先期已有報名，或同校已有隊伍在先搶期取得正取：列為候補，並顯示候補順位；這些候補在報名截止時都可參加截止補位。\n  - 5b. 自訂賽事：不檢查學校，依送出先後判定正取或候補。\n- **後置條件**\n  1. 報名狀態由「組隊中」改為已送出・待分配、正取或候補；名單鎖定，只有被主辦方退回時才解鎖。\n  2. 正取隊數不超過名額。\n  3. 操作紀錄完整，該隊隊長與選手收到站內通知與 Email。\n\n### （二）裁判登錄比分與送出系列結果\n\n| 項目 | 說明 |\n| --- | --- |\n| Use Case 名稱 | 裁判登錄比分與送出系列結果 |\n| 主要角色 | 裁判（場次未指派裁判時為代登的主辦方） |\n| 次要角色 | 隊長、系統（時間） |\n| 關聯功能群 | 場次進行、抽籤與對戰表 |\n| 對應需求 | FR-24、FR-26、FR-27、FR-29、FR-21 |\n| 優先順序 | 高 |\n\n- **前置條件**\n  1. 場次已指派裁判，且該裁判已接受該賽事的邀請；場次未指派裁判時，改由該賽事的主辦方代為登錄。\n  2. 兩隊隊長都已報到，裁判在場次頁看到「可開始」。\n- **觸發事件**：裁判在場次頁登錄第一局的結果。\n- **主要流程**\n  1. 每打完一局，裁判依遊戲的比分型態登錄該局結果（選勝隊，或輸入回合比分如 13:11）。\n  2. 系統鎖住該場次並記錄局結果；第一局登錄後，場次狀態變為「進行中」。\n  3. 一隊達到該輪 BO 的勝局門檻時，系統停止新增局數，並算出系列結果（如 2:1）。\n  4. 裁判送出系列結果，系統鎖定結果，記錄送出者與時間，場次進入「申訴期」並開始倒數。\n  5. 申訴期滿且無人申訴，系統自動將場次改為「已確認」，勝隊填入下一輪的位置；下一場兩隊都確定時，系統開始計算該場的棄權期限。\n  6. 下一輪對位確定後，系統通知兩隊隊長下一場的對手與時間。\n- **例外流程**\n  - 1a. 回合比分平手：無法送出。\n  - 1b. 不是被指派的裁判（場次已指派時），或不是該賽事主辦方（場次未指派時）：系統拒絕。\n  - 4a. 送出前發現某局登錄錯誤：裁判修改該局，系列結果重新計算。\n  - 5a. 申訴期內有隊長提出申訴：場次改為「申訴中」，勝隊不晉級，改由主辦方處理（見（三））。\n- **後置條件**\n  1. 各局比分與系列結果已鎖定，送出後裁判不能再修改。\n  2. 勝隊已晉級，或場次等待申訴處理。\n  3. 每一次登錄與送出都留下操作紀錄。\n\n### （三）隊長提出申訴與主辦方處理\n\n| 項目 | 說明 |\n| --- | --- |\n| Use Case 名稱 | 隊長提出申訴與主辦方處理 |\n| 主要角色 | 隊長、主辦方 |\n| 次要角色 | 系統 |\n| 關聯功能群 | 申訴與檢舉、場次進行、抽籤與對戰表 |\n| 對應需求 | FR-30、FR-31、FR-25、FR-21 |\n| 優先順序 | 高 |\n\n- **前置條件**\n  1. 場次狀態為「申訴期」或「申訴中」（裁判已送出系列結果，或已判棄權），且尚未超過申訴期限。\n  2. 提出者是該場兩隊之一的隊長，且該隊尚未對此場次申訴過。\n- **觸發事件**：隊長在場次頁按下「提出申訴」。\n- **主要流程**\n  1. 隊長填寫申訴說明，可附上截圖，送出申訴。\n  2. 系統確認仍在申訴期限內，建立申訴；場次若為「申訴期」則改為「申訴中」，並通知主辦方。\n  3. 主辦方在待處理清單開啟該場次的申訴（兩隊都申訴時一併列出），檢視說明、各局比分與結算截圖。\n  4. 主辦方選擇「維持原結果」或「更正結果」（重新輸入各局結果，由系統重算系列結果），並填寫理由。\n  5. 系統將該場次的申訴全部結案、場次改為「已確認」，觸發晉級，並把處理結果與理由通知兩隊。\n- **例外流程**\n  - 1a. 申訴期限已過：系統拒絕。\n  - 1b. 同一隊已對此場次申訴過：系統拒絕。\n  - 1c. 另一隊已先提出申訴（場次為「申訴中」）：仍可在申訴期限內提出，由主辦方一併處理。\n  - 4a. 等待這個結果的下一場預定開始前 1 小時仍未處理（決賽與季軍賽為申訴提出後 1 小時）：系統提醒主辦方一次。\n  - 4b. 申訴尚未處理時：等待這個結果的下一場（準決賽則含季軍賽）不開放報到、不起算棄權期限；處理完成、兩隊確定後，棄權期限從處理完成時間重新起算。同一輪的其他場次不受影響。\n  - 4c. 申訴對象是棄權判定、主辦方認定判錯：選擇「重新比賽」並設定新時間；申訴結案，場次回到「待開打」，清除棄權判定與報到紀錄，依新時間重新報到並起算棄權期限。\n- **後置條件**\n  1. 申訴結案，處理理由與處理者已保存。\n  2. 場次結果確定，勝隊（可能因更正而改變）晉級。\n  3. 更正前後的比分都記錄在操作紀錄中。\n\n## 三、泳道圖\n\n本節以泳道圖呈現跨角色的兩段主要流程：從建立賽事到公布對戰表，以及開賽日從報到到晉級。\n\n### （一）賽事建立到公布對戰表\n\n![泳道圖：賽事建立到公布對戰表](figures/B-swimlane-1.png)\n\n1. **主辦方**：申請成為主辦方並經核准後建立賽事；報名期間檢視段位截圖、退回不合格的報名；抽籤後指派裁判。\n2. **平台管理員**：審核主辦方申請，只讓真實社團取得建立賽事的權限。\n3. **隊長與選手**：建立隊伍、邀請隊員、填寫參賽資料並送出報名，之後收到分配結果與對戰表通知。\n4. **系統**：負責所有規則判斷與時間驅動的動作，包含名單鎖定、三階段名額分配、截止補位、抽籤與排定賽程。\n\n### （二）開賽日：報到到晉級\n\n![泳道圖：開賽日報到到晉級](figures/B-swimlane-2.png)\n\n1. **隊長**：開賽前 30 分鐘起報到；比賽結束後勝隊上傳結算截圖；對結果有異議時在申訴期內申訴。\n2. **裁判**：兩隊都報到後開始比賽，逐局登錄比分並送出系列結果。\n3. **系統**：判斷是否棄權、算出系列結果、管理申訴期倒數，期滿自動確認並推進晉級。\n4. **主辦方**：只在有人申訴時介入，維持或更正結果。\n\n## 四、狀態圖\n\n賽事、報名與場次是系統中三個有狀態的實體，狀態只能依下列轉換改變，任何不在圖上的轉換都會被系統拒絕。\n\n### （一）賽事狀態\n\n```mermaid\nstateDiagram-v2\n  state \"尚未開放\" as upcoming\n  state \"開放報名\" as open\n  state \"報名截止\" as closed\n  state \"賽程已公布\" as published\n  state \"進行中\" as ongoing\n  state \"已結束\" as finished\n  state \"已取消\" as cancelled\n  [*] --> upcoming : 建立賽事，報名開始時間未到\n  [*] --> open : 建立賽事，報名開始時間已到\n  upcoming --> open : 報名開始時間到\n  open --> closed : 截止時間到／提前抽籤\n  closed --> open : 正取不足 2 隊，延長報名\n  closed --> published : 抽籤完成\n  published --> ongoing : 第一個場次開放報到\n  ongoing --> finished : 決賽與季軍賽皆定案\n  upcoming --> cancelled : 主辦方取消\n  open --> cancelled : 主辦方取消\n  closed --> cancelled : 主辦方取消\n  published --> cancelled : 主辦方取消\n  ongoing --> cancelled : 主辦方取消\n  finished --> [*]\n  cancelled --> [*]\n```\n\n「尚未開放」時主辦方可以修改所有設定，開放報名後只能放寬。「報名開始時間到」與「第一個場次開放報到」（最早場次的預定開始前 30 分鐘）都是時間觸發，由 worker 執行。「定案」指場次已確認，或季軍賽已取消。\n\n### （二）報名狀態\n\n「組隊中」（建立隊伍後、尚未送出）與「已送出・待分配」（優先期內送出、等待優先期結束）都是正式的報名狀態。因此報名紀錄在建立隊伍時就產生，送出時才寫入學校、平均段位積分與送出時間的快照。\n\n```mermaid\nstateDiagram-v2\n  state \"組隊中\" as forming\n  state \"已送出・待分配\" as pending\n  state \"正取\" as accepted\n  state \"候補\" as waitlisted\n  state \"退回\" as rejected\n  state \"撤回\" as withdrawn\n  state \"已參賽\" as drawn\n  state \"退賽\" as retired\n  state \"取消資格\" as disqualified\n  [*] --> forming : 建立隊伍\n  forming --> pending : 優先期內送出\n  forming --> accepted : 送出，判定正取\n  forming --> waitlisted : 送出，判定候補\n  pending --> accepted : 優先期結束，正取\n  pending --> waitlisted : 優先期結束，候補\n  waitlisted --> accepted : 遞補／截止補位\n  waitlisted --> drawn : 抽籤後遞補\n  pending --> rejected : 退回\n  accepted --> rejected : 退回\n  waitlisted --> rejected : 退回\n  rejected --> forming : 修正重送\n  pending --> withdrawn : 撤回\n  accepted --> withdrawn : 撤回\n  waitlisted --> withdrawn : 撤回\n  forming --> withdrawn : 解散隊伍\n  accepted --> drawn : 抽籤\n  drawn --> retired : 退賽\n  pending --> disqualified : 取消資格\n  accepted --> disqualified : 取消資格\n  waitlisted --> disqualified : 取消資格\n  drawn --> disqualified : 取消資格\n```\n\n圖中各轉換的條件如下：\n\n1. **送出**：校園賽在優先期內送出為「已送出・待分配」；先搶期與自訂賽事送出時立即判定正取或候補。\n2. **遞補**：抽籤前的遞補與截止補位讓候補轉為正取；抽籤後有隊伍退賽或被取消資格時，被遞補的候補直接轉為「已參賽」並接手對戰表上的位置。抽籤時，正取隊伍轉為「已參賽」，候補隊伍保持候補。\n3. **退回、撤回**：只在抽籤前；退回由主辦方附原因執行，名單解鎖後由隊伍修正重送，重送時重新寫入快照與送出時間。組隊中的隊伍被隊長解散時也轉為撤回。**退賽**只在第一場開打前。\n4. **取消資格**：檢舉在賽事結束前都能對已送出報名的隊伍提出，因此待分配、正取、候補與已參賽都可能因檢舉屬實被取消資格。\n\n### （三）場次狀態\n\n```mermaid\nstateDiagram-v2\n  state \"待開打\" as scheduled\n  state \"進行中\" as live\n  state \"申訴期\" as appeal_window\n  state \"申訴中\" as appealed\n  state \"已確認\" as confirmed\n  state \"已取消\" as voided\n  [*] --> scheduled : 抽籤後建立場次\n  scheduled --> live : 裁判登錄第一局\n  scheduled --> appeal_window : 逾時判棄權\n  scheduled --> confirmed : 輪空\n  scheduled --> voided : 季軍賽取消\n  live --> appeal_window : 裁判送出系列結果\n  appeal_window --> confirmed : 申訴期滿且無申訴\n  appeal_window --> appealed : 隊長提出申訴\n  appealed --> appealed : 另一隊在申訴期限內申訴\n  appealed --> confirmed : 主辦方維持或更正\n  appealed --> scheduled : 重新比賽\n  live --> confirmed : 一方被取消資格\n  appeal_window --> confirmed : 一方被取消資格\n  appealed --> confirmed : 一方被取消資格\n  confirmed --> [*]\n  voided --> [*]\n```\n\n「待開打 → 申訴期」是逾時判棄權，一方或雙方未報到都適用。「待開打 → 已確認」用於輪空：對手位置確定不會有隊伍時（前一場雙方棄權，或退賽、取消資格後無人遞補），系統直接確認並讓另一方晉級。「已取消」只用於準決賽沒有產生勝隊時的季軍賽。場次停在「待開打」等待隊伍確定時，不開放報到、也不起算棄權期限（見貳、三 5.2）。「申訴中 → 待開打」只用於判棄權的場次經申訴後安排重新比賽（FR-31）。各種結果的欄位填法見資料表說明的 MATCH。\n\n## 五、實體關聯圖\n\n本系統的資料模型以「賽事、隊伍、報名、場次」為主軸：賽事複製遊戲設定、收到隊伍報名，抽籤後產生對戰表與場次；場次記錄每局比分、報到、結算截圖，並可能收到申訴；所有重要事件寫入事件與操作紀錄，再產生通知。全系統共 24 張資料表，為了閱讀清楚，依功能分成六張圖呈現，跨圖出現的實體（如 ACCOUNT、TOURNAMENT、TEAM、MATCH）是同一張資料表。\n\n### （一）帳號\n\n```mermaid\nerDiagram\n  SCHOOL |o--o{ ACCOUNT : \"就讀\"\n  SCHOOL ||--o{ ORGANIZER_APPLICATION : \"申請學校\"\n  ACCOUNT ||--o{ ACCOUNT_TOKEN : \"擁有\"\n  ACCOUNT ||--o{ ORGANIZER_APPLICATION : \"提出\"\n```\n\n### （二）賽事設定\n\n```mermaid\nerDiagram\n  ACCOUNT ||--o{ TOURNAMENT : \"主辦\"\n  GAME_TITLE ||--o{ RANK_TIER : \"定義段位\"\n  GAME_TITLE ||--o{ TOURNAMENT : \"被選用\"\n  TOURNAMENT ||--o{ ROUND_SETTING : \"分輪 BO\"\n  TOURNAMENT ||--o{ REFEREE_INVITATION : \"產生\"\n  TOURNAMENT ||--o{ TOURNAMENT_REFEREE : \"委任\"\n  ACCOUNT ||--o{ TOURNAMENT_REFEREE : \"擔任\"\n```\n\n### （三）隊伍與報名\n\n```mermaid\nerDiagram\n  TOURNAMENT ||--o{ TEAM : \"包含\"\n  TEAM ||--|{ TEAM_MEMBER : \"由組成\"\n  ACCOUNT ||--o{ TEAM_MEMBER : \"參加\"\n  TOURNAMENT ||--o{ TEAM_MEMBER : \"同賽事限一隊\"\n  TEAM ||--|| REGISTRATION : \"對應\"\n  TOURNAMENT ||--o{ REGISTRATION : \"收到\"\n  SCHOOL |o--o{ REGISTRATION : \"快照學校\"\n```\n\n### （四）對戰\n\n```mermaid\nerDiagram\n  TOURNAMENT ||--o| BRACKET : \"擁有\"\n  BRACKET ||--|{ MATCH : \"包含\"\n  TEAM |o--o{ MATCH : \"出賽\"\n  TEAM |o--o{ MATCH : \"勝隊\"\n  MATCH |o--o{ MATCH : \"下一場\"\n  ACCOUNT |o--o{ MATCH : \"擔任裁判\"\n  ACCOUNT |o--o{ MATCH : \"送出結果\"\n  MATCH ||--o{ MATCH_GAME : \"包含\"\n  TEAM |o--o{ MATCH_GAME : \"該局勝隊\"\n  MATCH ||--o{ CHECK_IN : \"記錄報到\"\n  TEAM ||--o{ CHECK_IN : \"報到\"\n  MATCH ||--o| RESULT_SCREENSHOT : \"佐證\"\n```\n\n### （五）爭議\n\n```mermaid\nerDiagram\n  MATCH ||--o{ APPEAL : \"收到\"\n  TEAM ||--o{ APPEAL : \"提出申訴\"\n  ACCOUNT |o--o{ APPEAL : \"處理申訴\"\n  TOURNAMENT ||--o{ REPORT : \"收到\"\n  TEAM ||--o{ REPORT : \"提出檢舉\"\n  TEAM ||--o{ REPORT : \"被檢舉\"\n  ACCOUNT |o--o{ REPORT : \"處理檢舉\"\n```\n\n### （六）通知與紀錄\n\n```mermaid\nerDiagram\n  OUTBOX_EVENT ||--o{ NOTIFICATION : \"產生\"\n  OUTBOX_EVENT ||--o{ EMAIL_DELIVERY : \"產生\"\n  ACCOUNT ||--o{ NOTIFICATION : \"收到\"\n  ACCOUNT ||--o{ EMAIL_DELIVERY : \"收件\"\n  ACCOUNT |o--o{ AUDIT_LOG : \"操作\"\n  TOURNAMENT |o--o{ AUDIT_LOG : \"所屬賽事\"\n```\n\n## 六、資料表說明\n\n資料表欄位以《物件設計文件》的類別設計為基礎，補上主鍵、外鍵、建立時間與唯一鍵；所有主鍵為 UUID，時間一律以 UTC 存放（timestamptz）。除了以業務時間記錄建立時刻的 BRACKET.drawn_at、CHECK_IN.at 與 AUDIT_LOG.at 之外，每張表都有 `created_at`。由多個欄位組成的唯一鍵寫在各表下方。實作後以 Alembic 遷移檔為準。\n\n### （一）ACCOUNT 帳號\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 帳號主鍵 |\n| email | VARCHAR | UNIQUE | 登入用 Email |\n| hashed_password | VARCHAR |  | 雜湊後的密碼 |\n| email_verified | BOOLEAN |  | 是否已完成 Email 驗證 |\n| display_name | VARCHAR |  | 顯示名稱 |\n| school_id | UUID | FK → SCHOOL.id | 學校（選填，從學校清單選擇；參加校園賽時必須設定） |\n| is_platform_admin | BOOLEAN |  | 是否為平台管理員 |\n| is_organizer | BOOLEAN |  | 是否具主辦方權限 |\n| credentials_version | INTEGER |  | 登入憑證版本；重設密碼時加 1，使先前簽發的登入憑證全部失效 |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n\n### （二）SCHOOL 學校\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| name | VARCHAR | UNIQUE | 學校正式名稱（例如「國立臺灣大學」） |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n\n學校清單以教育部大專校院名錄為初始資料，由平台管理員維護。同校檢查、每校名額與代表隊都以 `school_id` 比對，不比對文字。\n\n### （三）ACCOUNT_TOKEN 一次性 token\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| account_id | UUID | FK → ACCOUNT.id | 所屬帳號 |\n| purpose | VARCHAR（列舉） |  | 用途：verify_email、reset_password |\n| token_hash | VARCHAR |  | token 雜湊值，不存明文 |\n| expires_at | TIMESTAMPTZ |  | 到期時間（驗證 24 小時、重設 1 小時） |\n| used_at | TIMESTAMPTZ |  | 使用時間；空值代表未使用 |\n| created_at | TIMESTAMPTZ |  | 產生時間 |\n\n### （四）ORGANIZER_APPLICATION 主辦方申請\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| account_id | UUID | FK → ACCOUNT.id | 申請人 |\n| club_name | VARCHAR |  | 社團名稱 |\n| school_id | UUID | FK → SCHOOL.id | 社團所屬學校 |\n| status | VARCHAR（列舉） |  | 待審核、核准、退回 |\n| reject_reason | TEXT |  | 退回原因 |\n| created_at | TIMESTAMPTZ |  | 申請時間 |\n\n### （五）GAME_TITLE 遊戲\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| name | VARCHAR | UNIQUE | 遊戲名稱 |\n| starters | INTEGER |  | 每隊先發人數 |\n| substitutes | INTEGER |  | 每隊替補人數 |\n| default_bo | INTEGER |  | 預設 BO 數，限 1、3、5、7 |\n| game_minutes | INTEGER |  | 每局預估時間（分鐘），用於檢查每輪間隔與排定賽程 |\n| score_type | VARCHAR（列舉） |  | 比分型態：win_loss（只記勝負）、rounds（回合比分） |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n\n### （六）RANK_TIER 段位對照\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| game_id | UUID | FK → GAME_TITLE.id | 所屬遊戲 |\n| name | VARCHAR |  | 段位名稱 |\n| score | INTEGER |  | 對應的段位積分 |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n\n唯一鍵：（game_id, name），同一遊戲的段位名稱不重複。\n\n### （七）TOURNAMENT 賽事\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| organizer_id | UUID | FK → ACCOUNT.id | 主辦方 |\n| game_id | UUID | FK → GAME_TITLE.id | 選用的遊戲 |\n| name | VARCHAR |  | 賽事名稱 |\n| capacity | INTEGER |  | 名額（隊數） |\n| mode | VARCHAR（列舉） |  | 賽事模式：campus（校園賽）、custom（自訂） |\n| registration_start | TIMESTAMPTZ |  | 報名開始時間；未到時賽事為尚未開放 |\n| registration_end | TIMESTAMPTZ |  | 報名截止時間 |\n| priority_hours | INTEGER |  | 優先期長度（小時）；自訂賽事為空 |\n| start_at | TIMESTAMPTZ |  | 開賽日期 |\n| round_interval_minutes | INTEGER |  | 每輪間隔（分鐘），不得小於「棄權時限＋預設 BO 數 × 每局預估時間＋申訴期」 |\n| forfeit_minutes | INTEGER |  | 棄權時限，至少 15 分鐘 |\n| appeal_minutes | INTEGER |  | 申訴期，至少 30 分鐘 |\n| status | VARCHAR（列舉） |  | 賽事狀態：尚未開放、開放報名、報名截止、賽程已公布、進行中、已結束、已取消 |\n| livestream_url | VARCHAR |  | 直播連結（選填） |\n| game_snapshot | JSONB |  | 建立時複製的遊戲設定（人數、BO、每局預估時間、比分型態、段位對照） |\n| invite_token | VARCHAR | UNIQUE | 自訂賽事的報名連結 token；校園賽為空；主辦方重設時更換，舊連結立即失效 |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n\n### （八）ROUND_SETTING 分輪設定\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| tournament_id | UUID | FK → TOURNAMENT.id | 所屬賽事 |\n| round_no | INTEGER |  | 輪次 |\n| bo | INTEGER |  | 該輪 BO 數，限 1、3、5、7 |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n\n唯一鍵：（tournament_id, round_no），每一輪只有一筆設定。\n\n### （九）REFEREE_INVITATION 裁判邀請\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| tournament_id | UUID | FK → TOURNAMENT.id | 所屬賽事 |\n| token | VARCHAR | UNIQUE | 邀請連結 token |\n| created_at | TIMESTAMPTZ |  | 產生時間 |\n| expires_at | TIMESTAMPTZ |  | 到期時間（7 天）；重新產生時舊邀請立即到期 |\n\n### （十）TOURNAMENT_REFEREE 賽事裁判\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| tournament_id | UUID | FK → TOURNAMENT.id | 賽事 |\n| account_id | UUID | FK → ACCOUNT.id | 擔任裁判的帳號 |\n| created_at | TIMESTAMPTZ |  | 接受邀請的時間 |\n\n唯一鍵：（tournament_id, account_id），同一帳號在同一賽事只會是一筆裁判身分。\n\n### （十一）TEAM 隊伍\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| tournament_id | UUID | FK → TOURNAMENT.id | 所屬賽事（隊伍只屬於一個賽事） |\n| name | VARCHAR |  | 隊名 |\n| invite_token | VARCHAR | UNIQUE | 隊伍邀請連結 token |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n\n### （十二）TEAM_MEMBER 隊員\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| team_id | UUID | FK → TEAM.id | 所屬隊伍 |\n| tournament_id | UUID | FK → TOURNAMENT.id | 隊伍所屬的賽事（與 TEAM.tournament_id 相同），用於唯一鍵 |\n| account_id | UUID | FK → ACCOUNT.id | 隊員帳號 |\n| role | VARCHAR（列舉） |  | captain（隊長）、player（選手）；每隊恰好一位隊長；不區分先發與替補 |\n| game_account_id | VARCHAR |  | 遊戲 ID |\n| rank_tier | VARCHAR |  | 段位 |\n| rank_score | INTEGER |  | 換算後的段位積分 |\n| rank_screenshot_key | VARCHAR |  | 段位截圖的檔案鍵值 |\n| created_at | TIMESTAMPTZ |  | 加入時間 |\n\n唯一鍵：（tournament_id, account_id），同一帳號在同一賽事只能加入一支隊伍，也不會在同一隊重複出現。\n\n### （十三）REGISTRATION 報名\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| team_id | UUID | FK → TEAM.id，UNIQUE | 報名的隊伍；建立隊伍時同時建立 |\n| tournament_id | UUID | FK → TOURNAMENT.id | 賽事 |\n| status | VARCHAR（列舉） |  | 報名狀態：組隊中、已送出・待分配、正取、候補、退回、撤回、已參賽、退賽、取消資格 |\n| school_id | UUID | FK → SCHOOL.id | 校園賽送出時的學校（快照）；自訂賽事與組隊中為空 |\n| avg_rank_score | NUMERIC(6,2) |  | 送出時名單所有成員（含替補）的平均段位積分（快照）；組隊中為空 |\n| submitted_at | TIMESTAMPTZ |  | 送出時間（快照，被退回後重送時更新）；組隊中為空 |\n| reject_reason | TEXT |  | 退回原因 |\n| created_at | TIMESTAMPTZ |  | 建立時間（與隊伍同時） |\n\n### （十四）BRACKET 對戰表\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| tournament_id | UUID | FK → TOURNAMENT.id，UNIQUE | 賽事 |\n| size | INTEGER |  | 對戰表大小 P（2 的次方） |\n| rounds | INTEGER |  | 輪數 |\n| drawn_at | TIMESTAMPTZ |  | 抽籤時間（即建立時間） |\n\n### （十五）MATCH 場次\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| bracket_id | UUID | FK → BRACKET.id | 所屬對戰表 |\n| round_no | INTEGER |  | 輪次 |\n| slot_no | INTEGER |  | 該輪中的位置（季軍賽與決賽同輪，排在決賽之後） |\n| is_third_place | BOOLEAN |  | 是否為季軍賽 |\n| team_a_id | UUID | FK → TEAM.id | A 隊；尚未確定時為空 |\n| team_b_id | UUID | FK → TEAM.id | B 隊；尚未確定時為空 |\n| referee_account_id | UUID | FK → ACCOUNT.id | 指派的裁判帳號；指派時檢查該帳號是此賽事的裁判 |\n| scheduled_at | TIMESTAMPTZ |  | 預定開始時間 |\n| status | VARCHAR（列舉） |  | 場次狀態：待開打、進行中、申訴期、申訴中、已確認、已取消 |\n| outcome | VARCHAR（列舉） |  | 結果類型（見下表）；尚無結果時為空 |\n| winner_id | UUID | FK → TEAM.id | 勝隊 |\n| wins_a | INTEGER |  | A 隊勝局數 |\n| wins_b | INTEGER |  | B 隊勝局數 |\n| submitted_by | UUID | FK → ACCOUNT.id | 送出系列結果的帳號（裁判或代登的主辦方） |\n| submitted_at | TIMESTAMPTZ |  | 送出系列結果的時間 |\n| confirmed_at | TIMESTAMPTZ |  | 場次變為已確認的時間 |\n| forfeit_deadline | TIMESTAMPTZ |  | 棄權期限；兩隊都確定時才設定，空值代表尚未起算 |\n| appeal_deadline | TIMESTAMPTZ |  | 申訴期限 |\n| next_match_id | UUID | FK → MATCH.id | 勝隊晉級的下一場 |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n\n唯一鍵：（bracket_id, round_no, slot_no）。\n\n各種結果類型的欄位填法如下：\n\n| outcome | 情境 | winner_id | wins_a／wins_b |\n| --- | --- | --- | --- |\n| played 正常完賽 | 裁判送出系列結果 | 先達勝局門檻的一方 | 各局結果 |\n| forfeit 一方棄權 | 逾時只有一隊報到 | 已報到的一方 | 0／0 |\n| double_forfeit 雙方棄權 | 逾時兩隊都未報到 | 空 | 0／0 |\n| walkover 輪空 | 一方位置確定不會有隊伍 | 有隊伍的一方；兩方都沒有時為空 | 0／0 |\n| disqualified 取消資格 | 一方在本場進行中、申訴期或申訴中被取消資格 | 對手 | 保留已登錄的局數 |\n\n季軍賽取消時，場次狀態為「已取消」，outcome 與 winner_id 為空。申訴更正後依更正的各局結果重新填寫，outcome 改為 played；申訴後重新比賽時，outcome、winner_id 與勝局數清空，場次回到待開打。\n\n### （十六）MATCH_GAME 局\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| match_id | UUID | FK → MATCH.id | 所屬場次 |\n| game_no | INTEGER |  | 第幾局 |\n| winner_team_id | UUID | FK → TEAM.id | 該局勝隊 |\n| score_a | INTEGER |  | A 隊回合數（回合比分型態） |\n| score_b | INTEGER |  | B 隊回合數（回合比分型態） |\n| created_at | TIMESTAMPTZ |  | 登錄時間 |\n\n唯一鍵：（match_id, game_no）。\n\n### （十七）CHECK_IN 報到\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| match_id | UUID | FK → MATCH.id | 場次 |\n| team_id | UUID | FK → TEAM.id | 報到的隊伍 |\n| at | TIMESTAMPTZ |  | 報到時間 |\n\n唯一鍵：（match_id, team_id），每隊在每個場次只報到一次。\n\n### （十八）RESULT_SCREENSHOT 結算截圖\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| match_id | UUID | FK → MATCH.id，UNIQUE | 場次 |\n| file_key | VARCHAR |  | 截圖檔案鍵值 |\n| created_at | TIMESTAMPTZ |  | 上傳時間 |\n\n### （十九）APPEAL 申訴\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| match_id | UUID | FK → MATCH.id | 被申訴的場次 |\n| team_id | UUID | FK → TEAM.id | 提出申訴的隊伍 |\n| description | TEXT |  | 申訴說明 |\n| attachment_key | VARCHAR |  | 附件截圖鍵值 |\n| status | VARCHAR（列舉） |  | 處理中、已結案 |\n| decision | VARCHAR（列舉） |  | 維持原結果、更正結果、重新比賽（只用於棄權判定）；同一場次的申訴一次處理，決定與理由相同 |\n| reason | TEXT |  | 處理理由 |\n| handled_by | UUID | FK → ACCOUNT.id | 處理的主辦方 |\n| reminded_at | TIMESTAMPTZ |  | 逾期提醒的寄出時間；空值代表尚未提醒，每筆申訴只提醒一次 |\n| created_at | TIMESTAMPTZ |  | 提出時間 |\n\n唯一鍵：（match_id, team_id），每支隊伍對同一場次只能申訴一次。\n\n### （二十）REPORT 檢舉\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| tournament_id | UUID | FK → TOURNAMENT.id | 賽事 |\n| reporter_team_id | UUID | FK → TEAM.id | 檢舉的隊伍 |\n| reported_team_id | UUID | FK → TEAM.id | 被檢舉的隊伍 |\n| description | TEXT |  | 檢舉說明 |\n| attachment_key | VARCHAR |  | 附件截圖鍵值 |\n| status | VARCHAR（列舉） |  | 處理中、駁回、屬實 |\n| reason | TEXT |  | 處理理由 |\n| handled_by | UUID | FK → ACCOUNT.id | 處理的主辦方 |\n| created_at | TIMESTAMPTZ |  | 提出時間 |\n\n### （二十一）NOTIFICATION 站內通知\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| account_id | UUID | FK → ACCOUNT.id | 收件帳號 |\n| event_id | UUID | FK → OUTBOX_EVENT.id | 來源事件 |\n| type | VARCHAR |  | 通知類型 |\n| title | VARCHAR |  | 通知標題 |\n| link | VARCHAR |  | 點擊後導向的頁面 |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n| read_at | TIMESTAMPTZ |  | 已讀時間；空值代表未讀 |\n\n唯一鍵：（event_id, account_id），同一事件不會重複通知同一人。\n\n### （二十二）EMAIL_DELIVERY Email 寄送紀錄\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| event_id | UUID | FK → OUTBOX_EVENT.id | 來源事件 |\n| account_id | UUID | FK → ACCOUNT.id | 收件帳號 |\n| status | VARCHAR（列舉） |  | 待寄、已寄出、失敗 |\n| attempts | INTEGER |  | 已嘗試次數 |\n| last_error | TEXT |  | 最近一次失敗原因 |\n| next_attempt_at | TIMESTAMPTZ |  | 下一次可以嘗試寄送的時間；失敗後往後延 |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n\n唯一鍵：（event_id, account_id）。\n\n### （二十三）AUDIT_LOG 操作紀錄\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| seq | BIGINT |  | 資料庫產生的遞增序號；同一時間的紀錄依寫入順序排列 |\n| actor_id | UUID | FK → ACCOUNT.id | 操作者；系統自動執行時為空，代表 system |\n| tournament_id | UUID | FK → TOURNAMENT.id | 所屬賽事；帳號類的操作（註冊、主辦方申請等）不屬於任何賽事時為空 |\n| action | VARCHAR |  | 動作名稱 |\n| entity_type | VARCHAR |  | 對象的實體類型 |\n| entity_id | UUID |  | 對象主鍵 |\n| before | JSONB |  | 變更前內容 |\n| after | JSONB |  | 變更後內容 |\n| at | TIMESTAMPTZ |  | 操作時間 |\n\n本表由資料庫 trigger 拒絕 UPDATE 與 DELETE，只能新增；並以（tournament_id, at, seq）建立索引，主辦方查閱自己賽事的紀錄時直接依 tournament_id 篩選，不必跨模組查詢各實體表。\n\n### （二十四）OUTBOX_EVENT 事件\n\n| 欄位 | 資料型別 | PK／FK | 說明 |\n| --- | --- | --- | --- |\n| id | UUID | PK | 主鍵 |\n| type | VARCHAR |  | 事件名稱（過去式，例如 MatchResultConfirmed） |\n| payload | JSONB |  | 事件內容（實體 id 與事件特有資料） |\n| created_at | TIMESTAMPTZ |  | 建立時間 |\n| processed_at | TIMESTAMPTZ |  | worker 處理完成時間；空值代表未處理 |\n\n## 七、類別圖\n\n本節的類別圖為分析層級的領域模型，呈現系統中的核心概念、主要屬性與彼此的關聯與多重性；Service、Repository 等設計層級的類別請見《物件設計文件》。\n\n### （一）帳號、賽事與報名\n\n```mermaid\nclassDiagram\n  class School {\n    name\n  }\n  class Account {\n    email\n    display_name\n    is_platform_admin\n    is_organizer\n  }\n  class OrganizerApplication {\n    club_name\n    status\n  }\n  class GameTitle {\n    name\n    starters\n    substitutes\n    default_bo\n    game_minutes\n    score_type\n  }\n  class RankTier {\n    name\n    score\n  }\n  class Tournament {\n    name\n    capacity\n    mode\n    status\n    registration_start\n    registration_end\n    start_at\n  }\n  class RoundSetting {\n    round_no\n    bo\n  }\n  class TournamentReferee\n  class Team {\n    name\n    invite_token\n  }\n  class TeamMember {\n    role\n    game_account_id\n    rank_score\n  }\n  class Registration {\n    status\n    avg_rank_score\n    submitted_at\n  }\n  Account \"1\" --> \"0..*\" OrganizerApplication : 提出\n  Account \"1\" --> \"0..*\" Tournament : 主辦\n  GameTitle \"1\" *-- \"1..*\" RankTier\n  GameTitle \"1\" --> \"0..*\" Tournament : 設定來源\n  Tournament \"1\" *-- \"0..*\" RoundSetting\n  Tournament \"1\" --> \"0..*\" TournamentReferee : 委任\n  Account \"1\" --> \"0..*\" TournamentReferee : 擔任\n  Tournament \"1\" *-- \"0..*\" Team\n  Team \"1\" *-- \"1..*\" TeamMember\n  Account \"1\" --> \"0..*\" TeamMember : 參加\n  Team \"1\" --> \"1\" Registration : 對應\n  Account \"0..*\" --> \"0..1\" School : 就讀\n  OrganizerApplication \"0..*\" --> \"1\" School : 申請學校\n  Registration \"0..*\" --> \"0..1\" School : 快照學校\n```\n\n### （二）對戰、爭議與通知\n\n```mermaid\nclassDiagram\n  class Tournament {\n    status\n  }\n  class Team {\n    name\n  }\n  class Bracket {\n    size\n    rounds\n    drawn_at\n  }\n  class Match {\n    round_no\n    slot_no\n    is_third_place\n    status\n    outcome\n    scheduled_at\n    wins_a\n    wins_b\n    forfeit_deadline\n    appeal_deadline\n  }\n  class MatchGame {\n    game_no\n    score_a\n    score_b\n  }\n  class CheckIn {\n    at\n  }\n  class ResultScreenshot {\n    file_key\n  }\n  class Appeal {\n    description\n    status\n    decision\n    reason\n    reminded_at\n  }\n  class Report {\n    description\n    status\n    reason\n  }\n  class Notification {\n    title\n    link\n    read_at\n  }\n  class Account\n  Tournament \"1\" *-- \"0..1\" Bracket\n  Bracket \"1\" *-- \"1..*\" Match\n  Match \"0..*\" --> \"0..1\" Match : 下一場\n  Team \"0..2\" \u003c-- \"0..*\" Match : 對戰隊伍\n  Account \"0..1\" \u003c-- \"0..*\" Match : 擔任裁判\n  Match \"1\" *-- \"0..*\" MatchGame\n  Match \"1\" *-- \"0..2\" CheckIn\n  Match \"1\" *-- \"0..1\" ResultScreenshot\n  Appeal \"0..2\" \u003c-- \"1\" Match : 收到\n  Team \"1\" --> \"0..*\" Appeal : 提出\n  Tournament \"1\" --> \"0..*\" Report : 收到\n  Team \"1\" --> \"0..*\" Report : 提出檢舉\n  Team \"1\" --> \"0..*\" Report : 被檢舉\n  Account \"1\" --> \"0..*\" Notification : 收到\n```\n\n一個場次最多兩筆申訴：兩隊各一筆，第二筆須在申訴期限內提出（場次可能已是「申訴中」）。\n\n## 八、循序圖\n\n### （一）隊長送出報名\n\n下圖描述隊長送出報名時，系統如何以鎖住賽事資料列的方式依序處理同時送出的報名，確保正取隊數不超過名額。整個流程在同一個資料庫交易中完成，操作紀錄與通知事件也寫在同一個交易裡。\n\n```mermaid\nsequenceDiagram\n  actor Cap as 隊長\n  participant API as 後端 API\n  participant AP as 名額分配規則\n  participant DB as 資料庫\n  participant W as worker\n  Cap->>API: 送出報名\u003cbr/>（確認鎖定名單）\n  API->>DB: 開始交易\u003cbr/>鎖住賽事列（FOR UPDATE）\n  API->>API: 檢查隊長身分、\u003cbr/>名單完整、隊員同校\n  alt 條件不符\n    API-->>Cap: 拒絕，列出缺少的條件\n  else 條件符合\n    API->>AP: 依目前階段判定\n    AP-->>API: 已送出・待分配／正取／候補\n    API->>DB: 更新報名狀態（寫入快照）\n    API->>DB: 寫入操作紀錄與事件\n    API->>DB: 提交交易，釋放鎖\n    API-->>Cap: 正取或「候補第 N 位」\n    W->>DB: 讀取未處理的事件\n    W-->>Cap: 站內通知與 Email\n  end\n```\n\n### （二）裁判登錄比分與送出系列結果\n\n下圖描述裁判逐局登錄比分、送出系列結果，以及申訴期滿後由 worker 自動確認並推進晉級的過程。任何對場次的寫入都先鎖住該場次列，避免同時操作互相覆蓋。\n\n```mermaid\nsequenceDiagram\n  actor Ref as 裁判\n  participant API as 後端 API\n  participant DB as 資料庫\n  participant W as worker\n  actor Cap as 兩隊隊長\n  loop 每打完一局\n    Ref->>API: 登錄該局結果\n    API->>DB: 鎖住場次列\u003cbr/>檢查裁判身分\u003cbr/>與勝局門檻\n    API->>DB: 寫入局結果與操作紀錄\u003cbr/>（第一局時轉為進行中）\n    API-->>Ref: 目前系列比分\n  end\n  Ref->>API: 送出系列結果\n  API->>DB: 鎖住場次列\u003cbr/>轉為申訴期，記錄\u003cbr/>送出者與申訴期限\n  API-->>Ref: 申訴期開始倒數\n  Note over DB,W: 申訴期滿（預設 30 分鐘）\n  W->>DB: 查詢已到期\u003cbr/>且無申訴的場次\n  W->>DB: 鎖住場次、重新檢查\u003cbr/>狀態，轉為已確認\n  W->>DB: 勝隊填入下一場\u003cbr/>兩隊都確定時設定\u003cbr/>下一場的棄權期限\n  W->>DB: 寫入操作紀錄與事件\n  W-->>Cap: 通知下一場\u003cbr/>對手與時間\n```\n\n### （三）隊長提出申訴與主辦方處理\n\n下圖描述隊長在申訴期內提出申訴，主辦方維持或更正結果後，系統確認場次並推進晉級的過程。\n\n```mermaid\nsequenceDiagram\n  actor Cap as 隊長\n  participant API as 後端 API\n  participant DB as 資料庫\n  participant W as worker\n  actor Org as 主辦方\n  Cap->>API: 提出申訴\u003cbr/>（說明、截圖）\n  API->>DB: 鎖住場次列，確認\u003cbr/>未過申訴期限、\u003cbr/>該隊未申訴過\n  API->>DB: 建立申訴，申訴期\u003cbr/>轉為申訴中，寫入事件\n  W-->>Org: 通知有新的申訴\n  Note over Cap,Org: 申訴期限內，另一隊也可以提出申訴\n  Org->>API: 檢視該場次的申訴與各局比分\n  alt 維持原結果\n    Org->>API: 維持原結果（附理由）\n  else 更正結果\n    Org->>API: 重新輸入各局結果（附理由）\n    API->>API: 重算系列結果\n  end\n  API->>DB: 鎖住場次列\u003cbr/>申訴全部結案，轉為\u003cbr/>已確認，記錄變更前後比分\n  API->>DB: 勝隊填入下一場\u003cbr/>棄權期限從處理完成時\u003cbr/>重新起算；寫入事件\n  W-->>Cap: 兩隊收到處理結果與理由\n```\n\n# 肆、附錄：功能需求規格\n\n本附錄列出 FR-1～FR-41 的完整敘述與可測結果，是功能清單（貳、二）各項功能的詳細規格，也是 User Story 驗收條件與期末測試個案的依據。FR 編號沿用專案規劃階段的編號，依功能群排列；名詞以壹、四的名詞定義為準。非功能需求見貳、四。\n\n## 一、1.0 帳號與身分\n\n#### FR-1　註冊與登入\n\n訪客可以用 Email 與密碼註冊帳號並登入，學校為選填、從學校清單選擇；須完成 Email 驗證才能使用報名、申請等功能。\n\n**可測結果：**\n- 已註冊的 Email 再次註冊會被拒絕。\n- 註冊時可以不選學校；參加校園賽的隊員必須已設定學校（FR-13）。\n- 密碼以雜湊保存，資料庫中查不到明文。\n- 未驗證 Email 的帳號無法送出主辦方申請或報名。\n- 驗證連結 24 小時內有效；過期的連結無法完成驗證。\n- 未驗證的帳號可以要求重寄驗證信；重寄後，先前寄出的驗證連結全部失效。要求重寄時不論 Email 是否存在、是否已驗證，回應都相同，只有未驗證的帳號真的會寄出。\n- 密碼至少 8 個字元，不限字元種類。\n- 登入狀態 7 天內有效，不自動延長（不做 refresh token）；過期後使用需要登入的功能時，系統顯示「登入已過期，請重新登入。」並導向登入頁，登入後回到原頁面，未送出的表單內容不保留。\n\n#### FR-40　忘記與重設密碼\n\n訪客可以輸入註冊 Email 申請重設密碼，透過 Email 中的重設連結設定新密碼。\n\n**可測結果：**\n- 不論輸入的 Email 是否已註冊，畫面都顯示相同的訊息，無法藉此得知 Email 是否存在。\n- 重設連結 1 小時內有效，只能使用一次；過期或已使用的連結無法設定密碼。\n- 重新申請後，先前寄出的重設連結全部失效。\n- 設定新密碼後，舊密碼無法再登入。\n- 設定新密碼後，其他裝置上的登入全部失效，須重新登入。\n- 尚未完成 Email 驗證的帳號重設密碼成功時，一併視為已完成 Email 驗證。\n\n#### FR-2　主辦方申請\n\n帳號可以填寫社團名稱、從學校清單選擇學校，送出主辦方申請。\n\n**可測結果：**\n- 同一帳號同時只能有一筆待審核的申請。\n- 申請送出後狀態為「待審核」，申請人可查看。\n\n#### FR-3　審核主辦方申請\n\n平台管理員可以核准或退回主辦方申請；退回時須填寫原因。\n\n**可測結果：**\n- 核准後，該帳號立即可以建立賽事。\n- 退回後，申請人看到原因，並可修改後重新申請，不限次數。\n- 結果以站內通知與 Email 通知申請人。\n\n#### FR-4　邀請與指派裁判\n\n主辦方可以產生裁判邀請連結，邀請帳號擔任自己某個賽事的裁判，並把裁判指派到場次。\n\n**可測結果：**\n- 受邀者點開邀請連結並接受後，才成為該賽事的裁判；沒有帳號的需先註冊。\n- 裁判身分只在該賽事有效，不能操作其他賽事。\n- 一個場次指派一位裁判，只有被指派的裁判能登錄該場次比分；同賽事的其他裁判不行。一位裁判可以被指派到多個場次，包含同一時段的場次。\n- 不能把裁判指派到其隊伍參賽的場次；隊伍晉級後才出現這種情況時，系統取消該場的指派並通知主辦方改派，改派前由主辦方代為登錄（FR-26）。\n- 場次送出系列結果前，主辦方可以改派或收回指派；收回後由主辦方代為登錄，已登錄的局保留。\n- 裁判邀請連結產生後 7 天內有效；過期的連結無法接受。\n- 主辦方可以重新產生邀請連結；重新產生後，舊連結立即失效。\n\n#### FR-5　依身分控管權限\n\n系統依帳號在每個賽事、每支隊伍中的身分，決定可執行的操作。\n\n**可測結果：**\n- 非該隊隊長的帳號無法修改該隊伍或送出報名。\n- 非該賽事主辦方的帳號無法處理申訴、檢舉或取消資格。\n- 未登入的觀眾只能瀏覽公開頁面，所有寫入操作都被拒絕。\n\n## 二、2.0 賽事建立與遊戲設定\n\n#### FR-6　維護遊戲設定與學校清單\n\n平台管理員可以新增或修改遊戲，設定每隊先發人數、替補人數、預設 BO 數、每局預估時間、段位積分對照表與比分型態（只記勝負，或記回合比分如 13:11）；也可以維護學校清單。\n\n**可測結果：**\n- 新增一款遊戲後，主辦方建立賽事時即可選用，不需修改或重新部署程式。\n- 修改遊戲預設值不影響已建立的賽事。\n- BO 數只能是 1、3、5、7，勝局門檻為（BO＋1）÷ 2。\n- 學校清單以教育部大專校院名錄為初始資料，平台管理員可以新增或修正；帳號、主辦方申請與報名的學校一律從清單選擇，不能自由輸入。\n\n#### FR-7　建立賽事\n\n主辦方可以建立賽事，填寫賽事名稱、遊戲、名額、報名開始與截止時間、優先期長度（預設 1 天）、開賽日期、每輪間隔、棄權時限（預設 15 分鐘）、申訴期（預設 30 分鐘）、賽事模式（校園賽或自訂，見 FR-39）與直播連結（選填）；選擇遊戲後自動帶入該遊戲的預設值。\n\n**可測結果：**\n- 報名截止時間晚於開賽日期、名額少於 2 隊、棄權時限少於 15 分鐘或申訴期少於 30 分鐘時，無法建立。\n- 報名開始時間晚於報名截止時間，或（校園賽）優先期結束時間晚於報名截止時間時，無法建立。\n- 每輪間隔少於「棄權時限＋預設 BO 數 × 每局預估時間＋申訴期」時無法建立，並顯示最小間隔。例：每局預估 40 分鐘、BO1、棄權時限 15 分鐘、申訴期 30 分鐘時，每輪間隔至少 85 分鐘。\n- 報名開始時間已到時，建立後賽事狀態為「開放報名」；尚未到時為「尚未開放」，到時由系統自動改為開放報名。兩種狀態都出現在公開頁面。\n- 選擇自訂時不需填寫優先期長度。\n- 直播連結須為 http 或 https 網址，否則無法建立；有填寫時，賽事頁顯示「觀看直播」，點擊後另開分頁。\n\n#### FR-8　分輪設定 BO 數\n\n主辦方可以為每一輪設定不同的 BO 數（例如前幾輪 BO1、四強 BO3、決賽 BO5）。\n\n**可測結果：**\n- 未分輪設定時，全部輪次使用遊戲預設 BO 數。\n- 場次的勝負門檻依該輪 BO 數計算（BO3 先拿 2 局、BO5 先拿 3 局）。\n- BO 數只能是 1、3、5、7，其他值被拒絕。\n\n#### FR-9　修改賽事的限制\n\n賽事「尚未開放」時，主辦方可以修改所有設定；開放報名後到抽籤前，只能延長報名期間、提高名額、延長棄權時限、申訴期與每輪間隔，以及修改分輪 BO 數；抽籤後只能修改場次時間。\n\n**可測結果：**\n- 開放報名後，降低名額、更換遊戲、更改賽事模式、縮短棄權時限、申訴期或每輪間隔的操作被拒絕。\n- 延長棄權時限或申訴期後，每輪間隔仍須符合 FR-7 的下限，否則須一併延長每輪間隔。\n- 抽籤前修改分輪 BO 數時，BO 數仍限 1、3、5、7；某一輪的 BO 數使「棄權時限＋該輪 BO 數 × 每局預估時間＋申訴期」超過每輪間隔時，抽籤後依 FR-23 順延下一輪。\n- 提高名額後，新增的名額視同釋出的名額，立即依當下階段的遞補規則由候補遞補（FR-17）；優先期內提高名額時，在優先期結束時以新名額分配。\n- 抽籤後，修改名額、賽事模式、BO 數的操作被拒絕；修改場次時間成功並通知相關隊伍（FR-23）。\n- 直播連結不受上述限制，賽事結束前都可新增、修改或移除。\n\n#### FR-10　取消賽事\n\n主辦方可以取消尚未結束的賽事。\n\n**可測結果：**\n- 取消後賽事狀態為「已取消」，不再接受報名或登錄比分。\n- 取消後，系統不再對該賽事的場次判棄權、自動確認或提醒申訴，賽事狀態也不再隨時間改變。\n- 所有已報名隊伍的隊長與選手收到站內通知與 Email。\n\n#### FR-39　賽事模式\n\n主辦方建立賽事時選擇賽事模式：**校園賽**適用校際盃賽，**自訂**適用校內賽或只邀請特定隊伍的私人賽。\n\n**可測結果：**\n- 校園賽：同隊須同校，名額依三階段分配（FR-14～FR-16）。\n- 自訂：建立後主辦方取得賽事報名連結；未持有效連結的帳號無法建立隊伍；主辦方重設連結後，舊連結立即失效。\n- 自訂：不檢查隊員學校；送出報名即依先到先得判定正取，額滿列候補，候補依送出時間遞補，不受每校隊數上限。\n- 自訂賽事照常出現在公開列表並標示「邀請制報名」，不顯示報名入口與連結；對戰樹與比分照常公開。\n\n## 三、3.0 隊伍與報名\n\n校園賽的名額依三個階段分配：\n\n1. **優先期**（主辦方設定，預設開放報名後 1 天）：只收報名、不分配名額。結束時各校取平均段位積分最高的一隊為代表隊；代表隊數超過名額時，代表隊之間再比平均段位積分，取前 N 隊正取，其餘列候補。\n2. **先搶期**（優先期結束至報名截止）：優先期沒有任何報名、且目前沒有正取的學校，第一支送出報名的隊伍取得正取，直到名額用完；之後的報名列為候補。\n3. **截止補位**：報名截止時名額仍有剩餘，由候補依平均段位積分由高到低補位，每校最多 2 隊；順序與報名截止後的遞補相同（FR-17）。\n\n「優先期有報名」指優先期結束時，該校仍有「已送出・待分配」的報名；在優先期內撤回或被退回、且沒有重送的學校，視為優先期沒有報名。凡是依平均段位積分排序的規則（選代表隊、代表隊超過名額時取前 N 隊、截止補位、報名截止後的候補排序），同分時依序比較送出時間（較早者優先）與報名 id，確保每次計算的結果都相同。正取隊伍在第一場開打前退賽或被取消資格時，由候補依當下階段的規則遞補（FR-17）。\n\n#### FR-11　建立隊伍與邀請隊員\n\n隊長可以為某個賽事建立隊伍，取得邀請連結；帳號點開連結後加入隊伍。\n\n**可測結果：**\n- 隊伍只屬於一個賽事，不能拿去報其他賽事。\n- 同一帳號在同一賽事中只能加入一支隊伍；嘗試加入第二支會被拒絕。\n- 主辦方不能在自己主辦的賽事建立或加入隊伍。\n- 未註冊或未驗證 Email 的訪客點開連結，須先完成註冊與驗證才能加入。\n- 隊伍人數達到「先發＋替補」上限後，邀請連結失效；多人同時加入時依序處理，人數不會超過上限。\n- 自訂賽事中，未持有效賽事報名連結的帳號無法建立隊伍（FR-39）；隊友仍以隊伍邀請連結加入。\n\n#### FR-41　隊員異動與解散隊伍\n\n名單鎖定前（送出報名前，或被主辦方退回後），隊長可以移除隊員、把隊長身分轉讓給另一位隊員，或解散隊伍；隊員也可以自行退出隊伍。\n\n**可測結果：**\n- 名單鎖定期間（FR-13），移除隊員、轉讓隊長、退出與解散隊伍的操作都被拒絕。\n- 隊長不能移除自己；被移除的隊員離開隊伍，其參賽資料一併刪除，可再經邀請連結加入。\n- 只能轉讓給同隊的隊員；轉讓後原隊長成為一般選手，立即失去隊長的操作權限，新隊長取得。\n- 隊員自行退出後離開隊伍，其參賽資料一併刪除，可以加入同賽事的其他隊伍；隊長須先轉讓隊長身分才能退出。\n- 隊長解散隊伍後，所有隊員離開隊伍，報名狀態變為「撤回」，隊伍邀請連結失效；原隊員可以加入同賽事的其他隊伍。\n\n#### FR-12　填寫選手參賽資料\n\n選手可以為所屬隊伍填寫遊戲 ID、段位並上傳段位截圖；系統依遊戲的對照表換算段位積分。\n\n**可測結果：**\n- 段位不在該遊戲對照表內時無法送出。\n- 段位截圖限圖片格式且有大小上限（5 MB 以內的 JPG／PNG）。\n- 隊伍的平均段位積分由名單上所有成員（先發與替補）的段位積分計算，取到小數第二位，顯示在報名頁；系統不區分先發與替補，上場人員由隊伍在比賽時自行決定。\n\n#### FR-13　送出報名與鎖定名單\n\n隊長可以在報名期間送出報名；名單從此鎖定。\n\n**可測結果：**\n- 名單人數不足先發人數、有選手未填完參賽資料，或（校園賽）有隊員未設定學校、隊員學校不一致時，無法送出。\n- 送出後名單鎖定，任何人都不能新增、移除或替換隊員，選手的遊戲 ID、段位與段位截圖也不能修改；只有被主辦方退回（FR-18）時解鎖。\n- 報名期間以外送出，會被拒絕並顯示原因。\n\n#### FR-14　優先期名額分配\n\n校園賽的優先期結束時，系統依三階段規則第 1 步自動排出正取與候補。\n\n**可測結果：**\n- 同校在優先期有 3 隊報名時，只有平均段位積分最高的 1 隊成為代表隊。\n- 名額 32、優先期有 40 間學校報名時，正取為代表隊中平均段位積分最高的 32 隊，其餘 8 隊列候補。\n- 平均段位積分相同時，較早送出報名者優先；送出時間也相同時依報名 id 排序。\n\n#### FR-15　先搶期即時分配\n\n校園賽的先搶期內，系統在報名送出的當下判定正取或候補。\n\n**可測結果：**\n- 優先期已有報名的學校，其先搶期的報名一律列候補。\n- 優先期內送出後撤回或被退回、且優先期結束前沒有重送的學校，視為優先期沒有報名。\n- 同校已有隊伍在先搶期取得正取時，同校之後送出的隊伍列候補；報名截止時可參加截止補位（FR-16）。\n- 名額只剩 1 個時，多支隊伍同時送出，只有 1 支成為正取，其餘為候補。\n- 平行送出的報名數多於名額時（整合測試以 200 筆驗證），正取隊數不超過名額。\n\n#### FR-16　截止補位\n\n校園賽報名截止時名額仍有剩餘，系統由候補依平均段位積分由高到低補位，每校正取最多 2 隊；補位順序與報名截止後的遞補順序相同（FR-17）。\n\n**可測結果：**\n- 所有候補都參加補位，不論該校目前有沒有正取；優先期超過名額而列候補的代表隊，也和其他候補一起依平均段位積分排序。\n- 補位依平均段位積分由高到低，同分時依 FR-14 的順序；會使該校正取超過 2 隊的候補略過，改看下一隊。\n- 例：剩 2 個名額，候補依平均段位積分為 E（Z 校，已有 2 隊正取）、F（W 校，已有 1 隊正取）、G（W 校）、H（V 校，沒有正取）時，F、H 補位，E、G 仍為候補。\n- 補上的隊伍，與同一批候補依 FR-17「報名截止後」規則算出的候補順位前 N 位相同（N 為剩餘名額）。\n- 補位後，任何學校的正取隊數都不超過 2 隊。\n- 補位後仍有空位時，賽事以實際正取隊數進行抽籤。\n\n#### FR-17　退賽與候補遞補\n\n隊長可以在隊伍第一個場次開打前退賽；系統由候補依當下階段的遞補規則遞補，候補隊伍可以看到自己的候補順位。\n\n**可測結果：**\n- 抽籤前退賽等同撤回報名，釋出的名額由候補遞補；抽籤後退賽，遞補隊伍接手退賽隊伍在對戰表上的位置，並收到通知。\n- 遞補對象依名額釋出當下的階段決定（被退回、被取消資格、主辦方提高名額而釋出的名額同樣適用）：\n  - 校園賽先搶期內：由候補中「優先期沒有報名且目前沒有正取」學校的隊伍依送出先後遞補，沒有則保留空位給之後的報名；釋出的是優先期代表隊時，由同校平均段位積分次高的隊伍遞補。\n  - 校園賽報名截止後（含抽籤後）：依平均段位積分由高到低遞補，同分時較早送出者優先。\n  - 自訂賽事：依送出時間遞補。\n- 抽籤後沒有可遞補的候補時，退賽隊伍的對手輪空、直接晉級。\n- 校園賽遞補後該校正取隊數仍不超過 2 隊，不符合的候補略過；自訂賽事不受每校上限。\n- 候補順位（「候補第 N 位」）依上述遞補規則計算，N 是接下來陸續釋出名額時第幾個被遞補；照當下規則會被略過的候補沒有順位：\n  - 校園賽先搶期內：只有「優先期沒有報名且目前沒有正取」學校的候補有順位，依送出先後；同校只有最早送出的一隊有順位。例：X、Y 兩校優先期都沒有報名、目前也沒有正取，候補依送出先後為 A（優先期有報名的學校）、B（X 校）、C（X 校）、D（Y 校）時，B 為第 1 位、D 為第 2 位，A、C 沒有順位。\n  - 優先期代表隊釋出名額時由同校次高遞補，屬同校專屬的遞補，不計入順位。\n  - 校園賽報名截止後（含抽籤後）：依平均段位積分由高到低逐一排入，會使該校正取超過 2 隊的候補略過、沒有順位。例：候補依平均段位積分為 E（Z 校，已有 2 隊正取）、F（W 校，已有 1 隊正取）、G（W 校）、H（V 校，沒有正取）時，F 為第 1 位、H 為第 2 位，E、G 沒有順位。\n  - 自訂賽事：依送出時間，所有候補都有順位。\n- 順位隨報名狀態與階段變動，例如報名截止後改依平均段位積分重新排序；有隊伍遞補、撤回或被退回後，其餘候補的順位跟著更新。\n- 候補隊伍的隊長可在報名頁看到自己的候補順位與當下階段的遞補規則說明；沒有順位時顯示「候補・目前不在遞補順序中」與原因（例如「先搶期只遞補優先期沒有報名、目前也沒有正取的學校」）。\n\n#### FR-18　檢視段位截圖與退回報名\n\n主辦方可以檢視報名隊伍的段位截圖，並以原因退回報名；退回後名單解鎖，隊伍可在報名期間內修正重送。\n\n**可測結果：**\n- 退回時須填寫原因，隊長收到站內通知與 Email。\n- 被退回的正取隊伍釋出名額，依當下所處階段的規則重新分配。\n- 修正重送時，重新寫入學校、平均段位積分與送出時間的快照；在優先期結束後重送，依先搶期規則當下判定。\n\n## 四、4.0 抽籤與對戰表\n\n#### FR-19　抽籤\n\n報名截止時系統自動抽籤；主辦方可在截止前按下「抽籤」提前執行。\n\n**可測結果：**\n- 提前抽籤會立即結束報名；仍在優先期內時先完成優先期名額分配（FR-14），再執行截止補位（FR-16），最後抽籤。\n- 抽籤只能執行一次；抽籤後無法重抽。\n- 抽籤完成後賽事狀態為「賽程已公布」，所有正取隊伍的隊長與選手收到站內通知與 Email。\n- 正取隊數少於 2 隊時無法抽籤，主辦方須延長報名或取消賽事；延長報名期間後，賽事回到「開放報名」。\n\n#### FR-20　產生單淘汰對戰表\n\n系統依正取隊數產生對戰表。設 P 為不小於正取隊數的最小 2 的次方（例如 13 隊時 P＝16）：輪數為 log₂P，第一輪的輪空數為 P − 正取隊數；哪些隊伍輪空由抽籤隨機決定，輪空的位置平均分散在對戰表上。\n\n**可測結果：**\n- 8 隊：3 輪、0 個輪空、共 8 個場次（7 個淘汰場次＋1 個季軍賽）。\n- 13 隊：4 輪、3 個輪空、共 13 個場次（12 個淘汰場次＋1 個季軍賽）。\n- 正取少於 4 隊時不產生季軍賽。\n- 輪空數不超過 P ÷ 4 時，兩支輪空隊伍不會在第二輪相遇（例如 13 隊的 3 個輪空，第二輪的對手都是第一輪的勝隊）；超過時無法避免，這些場次在抽籤後就確定兩隊。\n- 同一組正取隊伍重複產生對戰表時，結構（輪數、場次數、輪空數）相同，只有對位隨機不同。\n\n#### FR-21　晉級推進\n\n場次變為「已確認」後，勝隊自動填入下一輪對應的位置；四強的敗隊進入季軍賽；決賽與季軍賽都定案後產生冠軍、亞軍、季軍，賽事狀態為「已結束」。\n\n**可測結果：**\n- 輪空隊伍在抽籤後直接出現在第二輪。\n- 某一方的位置確定不會有隊伍時（前一場雙方棄權，或退賽、取消資格後沒有候補可遞補），另一方以「輪空」晉級，該場直接變為已確認；兩方都沒有隊伍時，該場以無勝隊確認，並繼續往下一輪推進。\n- 準決賽沒有產生勝隊時（雙方棄權，或該場兩方都沒有隊伍）：另一場準決賽的勝隊以輪空贏得決賽、成為冠軍；季軍賽取消（場次狀態為「已取消」），另一場準決賽的敗隊列為亞軍，季軍從缺。\n- 下一輪場次的兩個位置都確定後，兩隊隊長收到下一場對手與時間的通知。\n- 已確認的場次結果不會被後續場次的登錄改動。\n\n#### FR-22　取消資格後的頂替\n\n隊伍被取消資格（FR-33）時，系統依該隊當時的處境調整對戰表。\n\n**可測結果：**\n- 該隊尚未比過任何場次 → 有候補時由候補遞補；沒有候補時對手輪空晉級（比照退賽）。\n- 該隊已贏過至少一場、正在等待下一場 → 由最近一場輸給它的隊伍頂替它在對戰表上的位置；更早的場次結果不變。\n- 被取消資格的是決賽隊伍時，頂替者是準決賽輸給它、正在等待季軍賽的隊伍：季軍賽尚未開打時，由它頂替進入決賽，季軍賽由對手輪空獲得季軍；季軍賽已開打或已定案時不頂替，決賽由對手輪空獲勝，亞軍從缺。\n- 被取消資格的隊伍正在等待季軍賽時，季軍賽由對手以輪空獲得季軍，不另找隊伍頂替。\n- 該隊有進行中、申訴期或申訴中的場次 → 該場直接判對手獲勝並確認，未結案的申訴一併結案，不另找隊伍頂替。\n- 該隊已被淘汰，或所有場次都已確認且沒有下一場 → 只把報名標示為取消資格，已確認的結果與對戰表不變。\n- 頂替的隊伍與相關場次的隊長收到通知。\n\n#### FR-23　排定場次時間\n\n抽籤後，系統依開賽日期與主辦方設定的每輪間隔，自動排定每個場次的開始時間；主辦方可以再個別修改。\n\n**可測結果：**\n- 同一輪的場次排在同一時段；下一輪的開始時間為上一輪開始時間加上每輪間隔。上一輪的 BO 數使「棄權時限＋該輪 BO 數 × 每局預估時間＋申訴期」超過每輪間隔時，下一輪順延到這個下限，並在抽籤結果中提示主辦方。\n- 修改時間後，兩隊隊長、選手與指派的裁判收到站內通知與 Email；兩隊都已確定的場次，棄權期限隨新時間重新計算。\n- 場次已開始（已有隊伍報到）後無法修改時間。\n- 修改的新時間不得早於現在，也不得晚於勝隊要去的下一場的預定時間；決賽與季軍賽不受後者限制。\n- 系統不自動把同一輪分批；裁判人手不足時，主辦方可個別修改場次時間來分批，或由同一位裁判負責多個場次（FR-4）。\n\n## 五、5.0 場次進行\n\n#### FR-24　報到\n\n隊長可以在場次預定開始前 30 分鐘起按下「報到」。\n\n**可測結果：**\n- 開賽前超過 30 分鐘按報到會被拒絕並顯示可報到時間。\n- 場次兩隊都確定後才開放報到；隊伍尚未確定（例如前一場仍在申訴中）時，報到被拒絕並顯示原因。\n- 只有該場次兩隊的隊長能為自己的隊伍報到。\n- 兩隊都報到後，指派的裁判看到「可開始」。\n\n#### FR-25　逾時判棄權\n\n過了棄權期限仍未報到的隊伍，系統判棄權。棄權期限為「預定開始時間」與「兩隊都確定的時間」兩者較晚者，再加上棄權時限（預設 15 分鐘）。\n\n**可測結果：**\n- 一隊未報到 → 判該隊棄權、對手獲勝；與一般結果相同，進入申訴期（FR-29）。\n- 兩隊都未報到 → 兩隊皆判棄權，同樣進入申訴期；申訴期滿後兩隊皆淘汰，下一輪的對手輪空晉級（FR-21）。\n- 隊伍尚未確定的場次不起算棄權期限，也不會被判棄權。前一場仍在申訴中時，只有等待該結果的場次（準決賽則含季軍賽）暫停，同一輪的其他場次照常進行；申訴處理完成、兩隊確定後，棄權期限從處理完成時間重新起算。\n- 兩隊與裁判收到站內通知與 Email。\n\n#### FR-26　登錄每局比分\n\n被指派的裁判可以登錄每一局的結果；欄位依遊戲的比分型態顯示（只選勝隊，或輸入回合比分）。\n\n**可測結果：**\n- 非被指派的裁判登錄會被拒絕；場次未指派裁判時，該賽事主辦方可代為登錄。\n- 兩隊都報到前，登錄會被拒絕。\n- 回合比分型態下，輸入的比分須分出勝負，平手無法送出。\n- 已有一隊達到該輪 BO 的勝局門檻後，無法再新增局數。\n- 登錄第一局後，場次狀態變為「進行中」。\n\n#### FR-27　送出系列結果\n\n系統依各局結果自動算出系列結果（如 2:1）；裁判送出後鎖定，申訴期開始。\n\n**可測結果：**\n- 送出前，裁判可以修改任一局的結果，系列結果跟著重新計算。\n- 尚無一隊達到該輪 BO 的勝局門檻時，無法送出。\n- 送出後，裁判無法再修改；更正只能經由申訴（FR-31）。\n- 送出時記錄送出者與時間；送出後場次為「申訴期」，尚未確認，勝隊不晉級。\n\n#### FR-28　上傳結算截圖\n\n勝隊隊長可以在系列結果送出後上傳結算截圖。\n\n**可測結果：**\n- 只有勝隊隊長能上傳；格式與大小限制同段位截圖。\n- 沒有上傳截圖不影響結果確認與晉級。\n\n#### FR-29　申訴期滿自動確認\n\n裁判送出系列結果（或判棄權）後，申訴期（預設 30 分鐘）內沒有申訴，系統自動確認結果並觸發晉級（FR-21）。\n\n**可測結果：**\n- 申訴期滿前，勝隊不會出現在下一輪。\n- 申訴期滿且無申訴時，場次狀態變為「已確認」，勝隊晉級。\n- 申訴期內有申訴時，場次維持「申訴中」，直到主辦方處理。\n\n## 六、6.0 申訴與檢舉\n\n申訴針對單一場次的結果（含棄權判定），在申訴期內由任一隊隊長提出，主辦方須在等待這個結果的下一場開始前處理。檢舉針對另一支隊伍的參賽資格（例如隊員不同校），賽事結束前都能提出；主辦方查證屬實就取消該隊資格，對戰表依 FR-22 調整。所有處理結果都附理由並通知相關隊伍。\n\n#### FR-30　提出申訴\n\n場次兩隊的隊長可以在申訴期限內提出申訴，填寫文字說明，並可附上截圖。\n\n**可測結果：**\n- 申訴期限（裁判送出系列結果或判棄權時起算的申訴期）過後提出會被拒絕。\n- 每支隊伍對同一場次只能提出一次申訴。\n- 第一筆申訴提出後場次狀態變為「申訴中」，主辦方收到站內通知與 Email；另一隊在申訴期限內仍可提出申訴，主辦方同樣收到通知。\n\n#### FR-31　處理申訴\n\n主辦方可以「維持原結果」或「更正結果」，並填寫理由；申訴對象是棄權判定時，也可以「重新比賽」。同一場次有兩筆申訴時一次處理，兩筆申訴以相同的決定與理由結案。\n\n**可測結果：**\n- 更正結果時，主辦方重新輸入各局結果，系統重算系列結果；更正後勝隊可能改變。\n- 重新比賽只適用於判棄權（一方或雙方）的場次：主辦方設定新的預定時間後，場次回到「待開打」，清除棄權判定與報到紀錄，棄權期限依新時間重新計算；兩隊與裁判收到新時間的通知。\n- 維持或更正後，場次狀態為「已確認」，觸發晉級（FR-21），兩隊收到處理結果與理由。\n- 等待這個結果的下一場預定開始前 1 小時仍未處理時，系統提醒主辦方（決賽與季軍賽沒有下一場，為申訴提出後 1 小時）；每筆申訴只提醒一次。\n- 主辦方可在賽事後台的待處理清單看到所有未結案的申訴與檢舉，依處理期限排序。\n- 申訴未處理前，等待這個結果的下一場不開放報到、不起算棄權期限（FR-24、FR-25）。\n\n#### FR-32　提出檢舉\n\n參賽隊伍的隊長可以在賽事結束前，對同賽事另一支已送出報名的隊伍提出資格檢舉，填寫文字說明並可附上截圖。\n\n**可測結果：**\n- 賽事狀態為「已結束」後無法提出檢舉。\n- 提出檢舉的隊伍須為待分配、正取、候補或已參賽；組隊中、退回、撤回、退賽或已取消資格的隊伍不能提出。\n- 不能檢舉自己的隊伍；只能檢舉報名狀態為待分配、正取、候補或已參賽的隊伍。\n- 提出後主辦方收到站內通知與 Email；被檢舉的隊伍在查證前不受影響。\n\n#### FR-33　查證檢舉與取消資格\n\n主辦方可以「駁回」檢舉或「取消資格」，並填寫理由。\n\n**可測結果：**\n- 取消資格後，對戰表依 FR-22 調整，被取消資格的隊伍標示為「取消資格」。\n- 檢舉人與被檢舉隊伍都收到處理結果與理由。\n- 駁回後，對戰表與該隊狀態不變。\n- 賽事已結束後，未結案的檢舉只能駁回或記錄屬實（附理由），不能取消資格，也不改動對戰表與名次。\n\n## 七、7.0 觀賽與通知\n\n#### FR-34　公開賽事頁\n\n觀眾可以瀏覽賽事列表與賽事頁，查看賽事資訊、報名狀態與正取隊伍。\n\n**可測結果：**\n- 未登入即可存取，不顯示選手的 Email 等個人資料。\n- 尚未開放的賽事顯示報名開始時間；已取消的賽事標示「已取消」。\n\n#### FR-35　視覺化對戰樹\n\n觀眾可以在賽事頁看到對戰樹：已確認的場次標示勝隊與系列比分，淘汰的隊伍以灰色顯示，尚未進行的場次顯示對戰隊伍與時間。\n\n**可測結果：**\n- 場次變為「已確認」後，開著頁面的觀眾在 10 秒內看到更新，不需手動重新整理。\n- 手機寬度（375 px）下對戰樹可閱讀、可左右捲動。\n- 輪空、棄權、取消資格以不同標示呈現。\n\n#### FR-36　場次頁\n\n觀眾可以點進場次，查看每一局的結果與目前狀態（待開打、進行中、申訴期、申訴中、已確認、已取消）。\n\n**可測結果：**\n- 申訴期與申訴中的場次不提前顯示晉級。\n- 結算截圖對觀眾公開；段位截圖只有該賽事主辦方看得到。\n\n#### FR-37　通知\n\n系統在下列事件發生時，同時發送站內通知與 Email 給相關的人：\n\n| 事件 | 通知對象 |\n| --- | --- |\n| 新的主辦方申請 | 平台管理員 |\n| 主辦方申請核准／退回 | 申請人 |\n| 報名結果（正取、候補、遞補、退回） | 該隊隊長與選手 |\n| 抽籤完成、場次時間變更 | 相關隊伍、指派的裁判 |\n| 報名截止時正取不足 2 隊、無法抽籤 | 主辦方 |\n| 下一場對手確定 | 兩隊隊長 |\n| 判棄權 | 兩隊、裁判 |\n| 申訴提出、處理完成 | 主辦方／兩隊 |\n| 檢舉提出、處理完成 | 主辦方／檢舉人與被檢舉隊伍 |\n| 申訴即將逾期未處理（每筆一次） | 主辦方 |\n| 裁判被指派到場次 | 該裁判 |\n| 裁判指派被取消（隊伍晉級造成衝突，或主辦方改派、收回） | 被取消指派的裁判；晉級衝突時另通知主辦方 |\n| 賽事取消 | 所有報名隊伍 |\n| 被移除出隊伍、隊伍解散 | 被移除的選手；解散時為所有隊員 |\n| 轉讓隊長 | 新隊長 |\n\n**可測結果：**\n- 每個事件只發一次，重送不會產生重複通知。\n- Email 寄送失敗不影響主流程，失敗會被記錄並重試。\n- 驗證信與重設密碼信（FR-1、FR-40）只寄 Email，不出現在站內通知中心。\n\n#### FR-38　站內通知中心\n\n登入的帳號可以在通知中心查看通知、看到未讀數量並標為已讀。\n\n**可測結果：**\n- 新通知出現在列表最上方，未讀數量加一。\n- 點開通知會導向相關頁面（賽事、場次或報名）。\n\n# 參考文獻\n\n1. 中華民國電子競技運動協會、正修科技大學（2024）。《2024 第六屆大專盃電競錦標賽特戰英豪項目競賽規程》。國立中央大學體育室轉載。https://pe.ncu.edu.tw/Uploads/2024-07-02/66839de8865eb.pdf\n2. Riot Games. *VALORANT API*. Riot Developer Portal. https://developer.riotgames.com/docs/valorant\n3. 本組（2026）。產品簡介、產品需求文件（PRD）、UX 設計（DESIGN.md、EXPERIENCE.md）與 Epic 規劃。專案資料夾 `_bmad-output/planning-artifacts/`。\n","figures":{"B-usecase-1":{"kind":"usecase","src":"system: 1.0 帳號與身分\nactor visitor left 1.5: 訪客\nactor account left 4.5: 帳號\nactor admin right 2: 平台管理員\nactor org right 4: 主辦方\nuc u1 1 1: 註冊並驗證 Email\nuc u2 2 1: 重寄驗證信\nuc u3 1 2: 忘記與重設密碼\nuc u4 1 3: 登入／登出\nuc u5 1 4: 維護帳號資料\nuc u6 1 5: 申請成為主辦方\nuc u7 1 6: 接受裁判邀請\nuc u8 2 2.5: 審核主辦方申請\nuc u9 2 4: 邀請裁判\nvisitor -- u1\nvisitor -- u3\naccount -- u4\naccount -- u5\naccount -- u6\naccount -- u7\nadmin -- u8\norg -- u9\nu2 ..> u1 : extend\n"},"B-usecase-2":{"kind":"usecase","src":"system: 2.0 賽事建立與遊戲設定\nactor admin left 1: 平台管理員\nactor org left 3.8: 主辦方\nactor viewer right 6: 觀眾\nactor timer right 4.4: 時間\nuc u1 1 1: 維護遊戲設定與學         fontFamily: '"Microsoft JhengHei", "微軟正黑體", sans-serif', fontSize: '16px',
        taskBkgColor: '#cfe2f3', taskBorderColor: '#3d6fa5', taskTextColor: '#000', taskTextDarkColor: '#000', taskTextLightColor: '#000', taskTextOutsideColor: '#000', taskTextClickableColor: '#000',
        doneTaskBkgColor: '#e6e6e6', doneTaskBorderColor: '#8c8c8c', activeTaskBkgColor: '#fde9c9', activeTaskBorderColor: '#c58a2b',
        sectionBkgColor: '#f5f5f5', altSectionBkgColor: '#ffffff', sectionBkgColor2: '#f5f5f5', gridColor: '#e0e0e0', todayLineColor: 'transparent',
      },
      flowchart: { htmlLabels: true, useMaxWidth: false, padding: 10 },
      sequence: { useMaxWidth: false, mirrorActors: false, wrap: false, width: 110, actorMargin: 30, boxMargin: 8, messageMargin: 32, actorFontSize: 15, messageFontSize: 15, noteFontSize: 15, actorFontFamily: '"Microsoft JhengHei"', messageFontFamily: '"Microsoft JhengHei"', noteFontFamily: '"Microsoft JhengHei"' },
      class: { useMaxWidth: false },
      state: { useMaxWidth: false },
      er: { useMaxWidth: false, fontSize: 14 },
      gantt: { useMaxWidth: false, fontSize: 12, sectionFontSize: 13, barHeight: 18, barGap: 5, topPadding: 40, leftPadding: 150, gridLineStartPadding: 30 },
    });
    const box = document.getElementById('render-box');
    const maxW = box.getBoundingClientRect().width;
    const maxH = 22 * 37.795;
    // 等比縮小到版心內；縮得太小時提出警告
    const fit = (el, label) => {
      const vb = (el.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
      const w = vb[2] || parseFloat(el.getAttribute('width')) || maxW;
      const h = vb[3] || parseFloat(el.getAttribute('height')) || 300;
      const scale = Math.min(1, maxW / w, maxH / h);
      el.removeAttribute('style');
      el.setAttribute('width', Math.round(w * scale));
      el.setAttribute('height', Math.round(h * scale));
      if (scale < 0.62) window.__ERRORS__.push('WARN ' + label + ' 縮放 ' + scale.toFixed(2));
    };
    // 每張圖以 data-key 標記，Word 檔依此對應到同一張圖
    // 泳道圖：自訂語法，直接產生 SVG
    for (const [i, code] of [...content.querySelectorAll('pre > code.language-swimlane')].entries()) {
      const fig = document.createElement('div');
      fig.className = 'figure';
      fig.dataset.key = 'swimlane-' + i;
      try {
        fig.innerHTML = window.renderSwimlane(code.textContent, Math.floor(maxW));
        fit(fig.querySelector('svg'), '泳道圖');
      } catch (err) {
        fig.classList.add('error');
        fig.textContent = '泳道圖錯誤：' + err.message;
        window.__ERRORS__.push('ERROR 泳道圖：' + err.message);
      }
      code.parentElement.replaceWith(fig);
    }
    // 使用案例圖：自訂語法，直接產生 SVG
    for (const [i, code] of [...content.querySelectorAll('pre > code.language-usecase')].entries()) {
      const fig = document.createElement('div');
      fig.className = 'figure';
      fig.dataset.key = 'usecase-' + i;
      try {
        fig.innerHTML = window.renderUseCase(code.textContent, Math.floor(maxW));
        fit(fig.querySelector('svg'), '使用案例圖');
      } catch (err) {
        fig.classList.add('error');
        fig.textContent = '使用案例圖錯誤：' + err.message;
        window.__ERRORS__.push('ERROR 使用案例圖：' + err.message);
      }
      code.parentElement.replaceWith(fig);
    }
    // 以圖檔引用的使用案例圖與泳道圖：PDF 排入向量圖，並另存 PNG 給 Markdown 預覽使用
    const toPng = async (svg) => {
      const vb = svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);
      const w = Number(vb[1]);
      const h = Number(vb[2]);
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * 2);
      canvas.height = Math.round(h * 2);
      const g = canvas.getContext('2d');
      g.fillStyle = '#ffffff';
      g.fillRect(0, 0, canvas.width, canvas.height);
      g.drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/png');
    };
    for (const img of [...content.querySelectorAll('img[data-figure]')]) {
      const m = img.getAttribute('data-figure').match(/^figures\/([\w.-]+)\.png$/);
      if (!m || !figures[m[1]]) continue;
      const { kind, src } = figures[m[1]];
      const label = kind === 'usecase' ? '使用案例圖' : '泳道圖';
      const fig = document.createElement('div');
      fig.className = 'figure';
      fig.dataset.key = 'img-' + m[1];
      try {
        const svg = kind === 'usecase' ? window.renderUseCase(src, Math.floor(maxW)) : window.renderSwimlane(src, Math.floor(maxW));
        window.__FIGURE_PNGS__[m[1]] = await toPng(svg);
        fig.innerHTML = svg;
        fit(fig.querySelector('svg'), label + ' ' + m[1]);
      } catch (err) {
        fig.classList.add('error');
        fig.textContent = label + '錯誤（' + m[1] + '）：' + err.message;
        window.__ERRORS__.push('ERROR ' + label + ' ' + m[1] + '：' + err.message);
      }
      const p = img.parentElement;
      (p.tagName === 'P' && p.childElementCount === 1 && !p.textContent.trim() ? p : img).replaceWith(fig);
    }
    const blocks = [...content.querySelectorAll('pre > code.language-mermaid')];
    for (let i = 0; i < blocks.length; i++) {
      const code = blocks[i].textContent;
      const fig = document.createElement('div');
      fig.className = 'figure';
      fig.dataset.key = 'mermaid-' + i;
      try {
        const { svg } = await mermaid.render('mmd' + i, code, box);
        fig.innerHTML = svg;
        fit(fig.querySelector('svg'), '圖 #' + (i + 1) + '（' + code.split('\n')[0] + '）');
      } catch (err) {
        fig.classList.add('error');
        fig.textContent = 'Mermaid 錯誤（圖 #' + (i + 1) + '）：' + (err && err.message ? err.message : err);
        window.__ERRORS__.push('ERROR 圖 #' + (i + 1) + '：' + (err && err.message ? err.message : err));
      }
      blocks[i].parentElement.replaceWith(fig);
      box.innerHTML = '';
    }

    // 4. 封面與目錄
    const members = meta.members.map((m, i) =>
      '<div class="row"><span class="label">' + (i === 0 ? '組 員' : '') + '</span><span>' + (i === 0 ? '：' : '　') + esc(m) + '</span></div>').join('');
    const cover = '<section class="cover">' +
      '<div class="school">' + esc(meta.school) + '</div>' +
      '<div class="school-en">' + esc(meta.school_en) + '</div>' +
      '<div class="dept">' + esc(meta.department) + '</div>' +
      '<div class="course">' + esc(meta.course) + '</div>' +
      '<div class="title">' + esc(doc.title) + '</div>' +
      '<div class="title-en">' + esc(doc.title_en) + '</div>' +
      '<div class="info">' +
        '<div class="row"><span class="label">題 目</span><span>：' + esc(meta.project) + '</span></div>' +
        '<div class="row"><span class="label">授課教授</span><span>：' + esc(meta.advisor) + '</span></div>' +
        '<div class="row"><span class="label">組 長</span><span>：' + esc(meta.leader) + '</span></div>' +
        members +
      '</div>' +
      '<div class="date">' + esc(meta.date) + '</div>' +
      '</section>';
    const toc = '<section class="toc"><h1 class="toc-title">目錄</h1>' + heads.map((h) =>
      '<div class="entry l' + h.tagName[1] + '"><span class="text">' + esc(h.textContent) + '</span><span class="dots"></span><span class="num" data-for="' + h.id + '"></span></div>').join('') + '</section>';

    const stage = document.getElementById('stage');
    stage.innerHTML = cover + toc;
    stage.appendChild(content);

    // 5. 分頁
    // 先移出頁面：Paged.js 會把文件中所有 style 元素當成樣式表處理，SVG 內的 style 會讓它出錯
    const html = stage.innerHTML;
    stage.remove();
    box.remove();
    await window.PagedPolyfill.preview(html, undefined, document.body);

    // 6. 頁碼（內文從第 1 頁起算，封面與目錄不編頁碼）與目錄頁碼
    const pages = [...document.querySelectorAll('.pagedjs_page')];
    const firstH1 = document.getElementById('h0');
    const firstContent = firstH1 ? pages.indexOf(firstH1.closest('.pagedjs_page')) : 0;
    const total = pages.length - firstContent;
    pages.forEach((p, i) => {
      if (i < firstContent) return;
      const f = document.createElement('div');
      f.className = 'page-footer';
      f.textContent = '第 ' + (i - firstContent + 1) + ' 頁，共 ' + total + ' 頁';
      p.appendChild(f);
    });
    document.querySelectorAll('.toc .num').forEach((n) => {
      const target = document.getElementById(n.dataset.for);
      const page = target && target.closest('.pagedjs_page');
      if (page) n.textContent = String(pages.indexOf(page) - firstContent + 1);
    });
    window.__PAGES__ = pages.length;
  } catch (err) {
    window.__ERRORS__.push('ERROR 排版失敗：' + describe(err));
  }
  window.__DONE__ = true;
})();
</script>
</body>
</html>
