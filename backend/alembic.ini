# Alembic 設定：單一資料庫。

[alembic]
# 遷移腳本所在目錄
script_location = app/alembic

# 產生遷移檔時的檔名樣板
# file_template = %%(rev)s_%%(slug)s

# 遷移檔內容與檔名中的日期所用的時區（傳給 dateutil.tz.gettz()；留空為本機時區）
# timezone =

# 檔名中 slug 的最大長度
#truncate_slug_length = 40

# 設為 'true' 時，執行 'revision' 指令也會載入 env.py（不論是否 autogenerate）
# revision_environment = false

# 設為 'true' 時，versions/ 目錄裡只有 .pyc／.pyo、沒有 .py 原始檔也會被當成遷移
# sourceless = false

# 遷移檔所在位置，預設為 alembic/versions；使用多個目錄時，初始遷移須以 --version-path 指定
# version_locations = %(here)s/bar %(here)s/bat alembic/versions

# 由 script.py.mako 產生遷移檔時使用的編碼
# output_encoding = utf-8

# 日誌設定
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
