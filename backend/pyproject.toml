[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "pydantic>=2.13.5",
    "emails>=1.1.2,<2.0",
    "jinja2<4.0.0,>=3.1.4",
    "alembic>=1.19.1,<2.0.0",
    "httpx<1.0.0,>=0.25.1",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sqlmodel>=0.0.46,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pyjwt>=2.15.0,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
]

[dependency-groups]
dev = [
    "pytest<10.0.0,>=7.4.3",
    "mypy<3.0.0,>=1.8.0",
    "ty>=0.0.25",
    "ruff<1.0.0,>=0.16.0",
    "coverage<8.0.0,>=7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle 錯誤
    "W",  # pycodestyle 警告
    "F",  # pyflakes
    "I",  # isort（import 排序）
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # 函式中未使用的參數
    "T201",   # 不允許 print
]
ignore = [
    "E501",  # 行太長：交給 formatter 處理
    "B008",  # 參數預設值中呼叫函式（FastAPI 的 Depends 需要）
    "W191",  # 縮排含 tab
    "B904",  # 允許拋例外時不加 from e（例如 HTTPException）
]

[tool.ruff.lint.pyupgrade]
# 即使檔案有 `from __future__ import annotations`，也保留執行期型別
keep-runtime-typing = true

[tool.pytest.ini_options]
filterwarnings = [
    # 開發環境的預設密碼 changethis 只會警告，測試輸出不需要它
    'ignore:The value of .* is "changethis":UserWarning',
]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
fail_under = 85
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ty.terminal]
error-on-warning = true

[tool.fastapi]
entrypoint = "app.main:app"
