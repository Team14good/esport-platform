# 後端測試的分層與追溯對應（Story 7.3）：分層與 Story／FR 對應的單一來源。
#
# - 每個 tests/ 底下的 test_*.py 一列，鍵為相對於 tests/ 的路徑；新增測試檔時要在這裡加一列，
#   tests/test_traceability.py 會檢查每個檔都有標、沒有多餘的列、格式正確。
# - layer：unit（不連資料庫：純函式、靜態檢查）或 integration（連 compose 的 PostgreSQL 18）。
#   tests/conftest.py 依這裡替每個案例加上同名的 pytest marker，`pytest -m unit` 只跑單元測試。
# - stories：Story 編號（"3.4"）；frs：需求編號（FR-n 或 NFR-n），至少各一個。
#   專案骨架、架構規則這類沒有直接對應功能需求的測試，標最接近的 NFR
#   （骨架、架構規則與部署 NFR-8、定時規則 NFR-4、權限 NFR-5、操作紀錄 NFR-3、交易與併發 NFR-1）。
# - 測試報告（scripts/test-all.sh）的追溯區塊依這裡替每個案例帶上 Story 與 FR。

